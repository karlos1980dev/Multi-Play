<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Palpite Certo</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #061109;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 650px;
    margin: auto;
    padding: 15px;
}

/* =========================
   TOPO
========================= */

.topo {
    text-align: center;
    padding: 10px 5px 20px;
}

.topo h1 {
    margin: 0;
    color: #25e66c;
    font-size: 31px;
    font-weight: 900;
    letter-spacing: 1px;
}

.topo p {
    margin: 7px 0 0;
    color: #a9bdb0;
    font-size: 13px;
}


/* =========================
   CONFIGURAÇÃO
========================= */

.config {
    background: #102319;
    border: 1px solid #28553a;
    border-radius: 15px;
    padding: 15px;
}

.config label {
    display: block;
    margin-bottom: 7px;
    color: #b8c9bd;
    font-size: 13px;
}

.config input {
    width: 100%;
    height: 46px;
    padding: 0 12px;

    background: #07140d;
    color: #fff;

    outline: none;

}

}


/* =========================
   BOTÕES
========================= */

button {
    width: 100%;
    min-height: 47px;

    border: none;
    border-radius: 11px;

    padding: 10px;

    color: #fff;
    font-size: 15px;
    font-weight: 900;

}

.btn-gerar {

            135deg,

}

.btn-imagem {

            #145dff,

}

.btn-download {

            135deg,

            #b865ff
        );
}

.btn-whatsapp {

            #20dc70
        );
}

.botoes {
    display: grid;
    gap: 9px;
    margin-top: 12px;
}


/* =========================
   LOADING
========================= */

.loading {
    display: none;
    text-align: center;
    padding: 25px;
}

.loading.ativo {
    display: block;
}

.spinner {
    width: 36px;
    height: 36px;

    border: 4px solid #254530;
    border-top-color: #25e66c;

    border-radius: 50%;

    margin: auto;

}

@keyframes girar {

    to {
        transform: rotate(360deg);
    }

}

========================= */

    background: #391818;

    margin-top: 15px;
}

.times {

}

.time {

}

.time img {
    width: 50px;
    height: 50px;

    object-fit: contain;

    display: block;

    margin:
        auto auto 6px;
}

.time-nome {
    font-size: 12px;

    font-weight: 800;

    line-height: 1.2;
}

.vs {
    text-align: center;

    color: #718879;

    font-size: 11px;

    font-weight: bold;
}

.placar {
    text-align: center;

    color: #25e66c;

    font-size: 28px;

    font-weight: 1000;

    margin-top: 10px;
}

.info-jogo {
    text-align: center;

    color: #7e9585;

    font-size: 10px;

    margin-top: 6px;
}


/* =========================
   ARTE
========================= */

.area-arte {
    display: none;

    margin-top: 20px;
}

.area-arte.visivel {
    display: block;
}

#arte {

    width: 100%;

    background:
        radial-gradient(
            circle at top,

            #0b2515 35%,
            #061109 100%
        );

    border: 1px solid #2d6942;

}

.arte-topo {
    text-align: center;

}

.arte-titulo {
    color: #27e66d;

    font-weight: 1000;

}

.arte-subtitulo {
    margin-top: 5px;

    font-size: 11px;
}

.arte-jogo {

    display: grid;

    grid-template-columns:
        1fr 65px 1fr;

    align-items: center;

    gap: 5px;

    padding: 11px 0;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);
}

.arte-time {
    text-align: center;
}

.arte-time img {

    width: 40px;
    height: 40px;

    object-fit: contain;

        auto auto 4px;
}

.arte-time span {

    display: block;

}

.arte-placar {

/* =========================
   DESKTOP
========================= */

@media (min-width: 700px) {

    .container {
        padding-top: 25px;
    }

    }

}

<script>

/* =====================================================
   PALPITE CERTO
   JAVASCRIPT COMPLETO
===================================================== */


/* =====================================================
   API-FOOTBALL
===================================================== */

const API_BASE =
    "https://v3.football.api-sports.io";

const API_KEY =
    "275f8195f07eaf0bde6b19c501b2926b";

const TIMEZONE =
    "America/Sao_Paulo";


/* =====================================================
   VARIÁVEIS
===================================================== */

let jogosSelecionados = [];

let imagemGerada = null;

let placaresUsados = [];


/* =====================================================
   PLACARES POSSÍVEIS
===================================================== */

const PLACARES_PROVAVEIS = [

    "0:0",

    "1:0",
    "0:1",
    "1:1",

    "2:0",
    "0:2",
    "2:1",
    "1:2",
    "2:2",

    "3:0",
    "0:3",
    "3:1",
    "1:3",
    "3:2",
    "2:3",
    "3:3",

    "4:0",
    "0:4",
    "4:1",
    "1:4",
    "4:2",
    "2:4",

    "4:3",
    "3:4",
    "4:4",

    "5:0",
    "0:5",
    "5:1",
    "1:5",

    "5:2",
    "2:5",
    "5:3",
    "3:5",

    "5:4",
    "4:5"

];


/* =====================================================
   INICIAR DATA
===================================================== */

function definirDataAtual() {

    const agora =
        new Date();


    const ano =
        agora.getFullYear();


    const mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    const campo =
        document.getElementById(
            "dataJogo"
        );


    if (campo) {

        campo.value =
            `${ano}-${mes}-${dia}`;

    }

}


document.addEventListener(
    "DOMContentLoaded",
    definirDataAtual
);


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    if (!elemento) {
        return;
    }


    elemento.textContent =
        texto;


    elemento.classList.add(
        "visivel"
    );

}


function esconderMensagem() {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    if (!elemento) {
        return;
    }


    elemento.classList.remove(
        "visivel"
    );

}


function mostrarMensagemTemporaria(
    texto
) {

    const elemento =
        document.getElementById(
            "mensagem"
        );


    if (!elemento) {
        return;
    }


    elemento.textContent =
        texto;


    elemento.classList.add(
        "visivel"
    );


    setTimeout(
        () => {

            elemento.classList.remove(
                "visivel"
            );

        },
        2500
    );

}


/* =====================================================
   LOADING
===================================================== */

function mostrarLoading(
    ativo
) {

    const elemento =
        document.getElementById(
            "loading"
        );


    if (!elemento) {
        return;
    }


    if (ativo) {

        elemento.classList.add(
            "ativo"
        );

    } else {

        elemento.classList.remove(
            "ativo"
        );

    }

}


/* =====================================================
   BUSCAR JOGOS
===================================================== */

async function buscarJogos() {

    esconderMensagem();


    const campoData =
        document.getElementById(
            "dataJogo"
        );


    const data =
        campoData?.value?.trim();


    if (!data) {

        mostrarMensagem(
            "Escolha a data dos jogos."
        );

        return;

    }


    mostrarLoading(true);


    const palpites =
        document.getElementById(
            "palpites"
        );


    if (palpites) {

        palpites.innerHTML =
            "";

    }


    const areaArte =
        document.getElementById(
            "areaArte"
        );


    if (areaArte) {

        areaArte.classList.remove(
            "visivel"
        );

    }


    jogosSelecionados = [];

    imagemGerada = null;

    placaresUsados = [];


    try {

        /* =============================================
           UMA CONSULTA PARA A DATA
        ============================================= */

        const url =
            `${API_BASE}/fixtures` +
            `?date=${encodeURIComponent(data)}` +
            `&timezone=${encodeURIComponent(TIMEZONE)}`;


        console.log(
            "📡 Buscando jogos:",
            url
        );


        const resposta =
            await fetch(
                url,
                {
                    method: "GET",

                    headers: {

                        "x-apisports-key":
                            API_KEY

                    }

                }
            );


        if (!resposta.ok) {

            throw new Error(
                "Erro na API. HTTP " +
                resposta.status
            );

        }


        const dados =
            await resposta.json();


        console.log(
            "📊 Resposta API:",
            dados
        );


        if (
            !dados ||
            !Array.isArray(
                dados.response
            )
        ) {

            throw new Error(
                "A API não retornou uma lista de jogos."
            );

        }


        /* =============================================
           FILTRAR JOGOS
        ============================================= */

        let jogos =
            dados.response.filter(
                jogoValido
            );


        /* =============================================
           REMOVER FINALIZADOS/CANCELADOS
        ============================================= */

        jogos =
            jogos.filter(
                jogo => {

                    const status =
                        String(
                            jogo?.fixture?.status?.short ||
                            ""
                        ).toUpperCase();


                    const statusExcluido = [

                        "FT",
                        "AET",
                        "PEN",
                        "CANC",
                        "PST",
                        "ABD",
                        "AWD",
                        "WO"

                    ];


                    return !statusExcluido.includes(
                        status
                    );

                }
            );


        /* =============================================
           REMOVER CATEGORIAS INDESEJADAS
        ============================================= */

        jogos =
            jogos.filter(
                jogo =>
                    !ehCategoriaIndesejada(
                        jogo
                    )
            );


        console.log(
            "⚽ Jogos válidos:",
            jogos.length
        );


        /* =============================================
           SEPARAR BRASIL
        ============================================= */

        const jogosBrasil =
            jogos.filter(
                ehJogoDoBrasil
            );


        /* =============================================
           SÉRIE A
        ============================================= */

        const serieA =
            jogosBrasil.filter(
                ehSerieA
            );


        /* =============================================
           SÉRIE B
        ============================================= */

        const serieB =
            jogosBrasil.filter(
                ehSerieB
            );


        /* =============================================
           OUTROS BRASIL
        ============================================= */

        const outrosBrasil =
            jogosBrasil.filter(
                jogo => {

                    return (
                        !serieA.includes(
                            jogo
                        ) &&
                        !serieB.includes(
                            jogo
                        )
                    );

                }
            );


        /* =============================================
           ORDENAR
        ============================================= */

        ordenarPorHorario(
            serieA
        );

        ordenarPorHorario(
            serieB
        );

        ordenarPorHorario(
            outrosBrasil
        );

        ordenarPorHorario(
            jogos
        );


        /* =============================================
           CRIAR LISTA PRIORIZADA
        ============================================= */

        const jogosPrioritarios = [];


        /*
         * 1º SÉRIE A
         */

        adicionarJogosUnicos(
            jogosPrioritarios,
            serieA
        );


        /*
         * 2º SÉRIE B
         */

        adicionarJogosUnicos(
            jogosPrioritarios,
            serieB
        );


        /*
         * 3º OUTROS BRASIL
         */

        adicionarJogosUnicos(
            jogosPrioritarios,
            outrosBrasil
        );


        /*
         * 4º OUTROS PAÍSES
         *
         * SOMENTE PARA COMPLETAR.
         */

        if (
            jogosPrioritarios.length < 6
        ) {

            adicionarJogosUnicos(
                jogosPrioritarios,
                jogos
            );

        }


        console.log(
            "🇧🇷 Série A:",
            serieA.length
        );

        console.log(
            "🇧🇷 Série B:",
            serieB.length
        );

        console.log(
            "🇧🇷 Outros Brasil:",
            outrosBrasil.length
        );

        console.log(
            "📋 Lista priorizada:",
            jogosPrioritarios.length
        );


        /* =============================================
           VERIFICAR SE EXISTEM JOGOS
        ============================================= */

        if (
            jogosPrioritarios.length === 0
        ) {

            throw new Error(
                "Não encontrei jogos profissionais disponíveis para essa data."
            );

        }


        /* =============================================
           SELECIONAR 6
        ============================================= */

        jogosSelecionados =
            selecionarSeisJogos(
                jogosPrioritarios
            );


        /* =============================================
           GERAR PALPITES
        ============================================= */

        placaresUsados = [];


        jogosSelecionados =
            jogosSelecionados.map(
                gerarPalpite
            );


        /* =============================================
           MOSTRAR
        ============================================= */

        mostrarPalpites();


        montarArte();


        if (areaArte) {

            areaArte.classList.add(
                "visivel"
            );

        }


        console.log(
            "✅ Palpites:",
            jogosSelecionados
        );


    } catch (erro) {

        console.error(
            "❌ Erro:",
            erro
        );


        mostrarMensagem(
            erro?.message ||
            "Não foi possível carregar os jogos."
        );


    } finally {

        mostrarLoading(false);

    }

}


/* =====================================================
   VALIDAR JOGO
===================================================== */

function jogoValido(
    jogo
) {

    const id =
        jogo?.fixture?.id;


    const casa =
        jogo?.teams?.home?.name;


    const fora =
        jogo?.teams?.away?.name;


    return Boolean(
        id &&
        casa &&
        fora
    );

}


/* =====================================================
   VERIFICAR CATEGORIAS INDESEJADAS
===================================================== */

function ehCategoriaIndesejada(
    jogo
) {

    const liga =
        normalizarTexto(
            jogo?.league?.name
        );


    const tipo =
        normalizarTexto(
            jogo?.league?.type
        );


    const pais =
        normalizarTexto(
            jogo?.league?.country
        );


    const casa =
        normalizarTexto(
            jogo?.teams?.home?.name
        );


    const fora =
        normalizarTexto(
            jogo?.teams?.away?.name
        );


    const texto =
        `
        ${liga}
        ${tipo}
        ${pais}
        ${casa}
        ${fora}
        `;


    /*
     * SUB-15 ATÉ SUB-23
     */

    const base =
        /sub[\s-]*(15|16|17|18|19|20|21|22|23)/i;


    /*
     * U15 ATÉ U23
     */

    const categoriaU =
        /\bu[\s-]*(15|16|17|18|19|20|21|22|23)\b/i;


    /*
     * UNDER 15 ATÉ UNDER 23
     */

    const under =
        /under[\s-]*(15|16|17|18|19|20|21|22|23)/i;


    /*
     * OUTRAS CATEGORIAS DE BASE
     */

    const palavrasBase =
        /youth|juvenil|junior|júnior|academy|academia|reserva|reserve|u18|u19|u20|u21|u22|u23/i;


    if (
        base.test(texto) ||
        categoriaU.test(texto) ||
        under.test(texto) ||
        palavrasBase.test(texto)
    ) {

        console.log(
            "🚫 Categoria de base removida:",
            jogo?.league?.name,
            casa,
            "x",
            fora
        );


        return true;

    }


    /*
     * FEMININO
     */

    const feminino =
        /women|woman|feminino|feminina|women's|womens/i;


    if (
        feminino.test(texto)
    ) {

        console.log(
            "🚫 Feminino removido:",
            jogo?.league?.name
        );


        return true;

    }


    return false;

}


/* =====================================================
   NORMALIZAR TEXTO
===================================================== */

function normalizarTexto(
    texto
) {

    return String(
        texto || ""
    )
    .normalize(
        "NFD"
    )
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}


/* =====================================================
   VERIFICAR BRASIL
===================================================== */

function ehJogoDoBrasil(
    jogo
) {

    const pais =
        normalizarTexto(
            jogo?.league?.country
        );


    return (
        pais === "brazil" ||
        pais === "brasil"
    );

}


/* =====================================================
   VERIFICAR SÉRIE A
===================================================== */

function ehSerieA(
    jogo
) {

    if (
        !ehJogoDoBrasil(
            jogo
        )
    ) {

        return false;

    }


    const liga =
        normalizarTexto(
            jogo?.league?.name
        );


    /*
     * Nomes normalmente utilizados
     * pela API-Football.
     */

    return (

        liga.includes(
            "serie a"
        ) ||

        liga.includes(
            "brasileirao serie a"
        ) ||

        liga.includes(
            "brasileirao"
        )

    );

}


/* =====================================================
   VERIFICAR SÉRIE B
===================================================== */

function ehSerieB(
    jogo
) {

    if (
        !ehJogoDoBrasil(
            jogo
        )
    ) {

        return false;

    }


    const liga =
        normalizarTexto(
            jogo?.league?.name
        );


    return (

        liga.includes(
            "serie b"
        ) ||

        liga.includes(
            "brasileirao serie b"
        )

    );

}


/* =====================================================
   ORDENAR POR HORÁRIO
===================================================== */

function ordenarPorHorario(
    lista
) {

    lista.sort(
        (a, b) => {

            const dataA =
                new Date(
                    a?.fixture?.date
                ).getTime();


            const dataB =
                new Date(
                    b?.fixture?.date
                ).getTime();


            return (
                dataA -
                dataB
            );

        }
    );


    return lista;

}


/* =====================================================
   ADICIONAR JOGOS ÚNICOS
===================================================== */

function adicionarJogosUnicos(
    destino,
    origem
) {

    origem.forEach(
        jogo => {

            const id =
                jogo?.fixture?.id;


            const jaExiste =
                destino.some(
                    item =>
                        String(
                            item?.fixture?.id
                        ) ===
                        String(id)
                );


            if (
                !jaExiste &&
                destino.length < 6
            ) {

                destino.push(
                    jogo
                );

            }

        }
    );

}


/* =====================================================
   SELECIONAR 6 JOGOS
===================================================== */

function selecionarSeisJogos(
    jogos
) {

    const lista =
        Array.isArray(jogos)
            ? jogos.slice()
            : [];


    if (
        lista.length <= 6
    ) {

        return lista;

    }


    /*
     * Como a lista já está
     * priorizada, os primeiros
     * jogos possuem preferência.
     *
     * Há uma pequena aleatoriedade
     * para não gerar exatamente
     * os mesmos 6 toda vez.
     */

    const resultado = [];


    /*
     * Misturar somente uma parte
     * inicial da lista.
     */

    const limiteMistura =
        Math.min(
            lista.length,
            12
        );


    const candidatos =
        lista.slice(
            0,
            limiteMistura
        );


    while (
        resultado.length < 6 &&
        candidatos.length > 0
    ) {

        const indice =
            Math.floor(
                Math.random() *
                candidatos.length
            );


        const jogo =
            candidatos.splice(
                indice,
                1
            )[0];


        if (jogo) {

            resultado.push(
                jogo
            );

        }

    }


    /*
     * Completar caso necessário.
     */

    for (
        const jogo of lista
    ) {

        if (
            resultado.length >= 6
        ) {

            break;

        }


        const id =
            jogo?.fixture?.id;


        const existe =
            resultado.some(
                item =>
                    String(
                        item?.fixture?.id
                    ) ===
                    String(id)
            );


        if (!existe) {

            resultado.push(
                jogo
            );

        }

    }


    return resultado.slice(
        0,
        6
    );

}


/* =====================================================
   GERAR PALPITE
===================================================== */

function gerarPalpite(
    jogo
) {

    const casa =
        jogo?.teams?.home;


    const fora =
        jogo?.teams?.away;


    const forcaCasa =
        obterForca(
            casa
        );


    const forcaFora =
        obterForca(
            fora
        );


    const diferenca =
        forcaCasa -
        forcaFora;


    let candidatos = [];


    /*
     * CASA MAIS FORTE
     */

    if (
        diferenca > 0.12
    ) {

        candidatos = [

            "1:0",
            "2:0",
            "2:1",
            "3:0",
            "3:1",
            "3:2",
            "4:1",
            "4:2",
            "1:1",
            "2:2"

        ];

    }


    /*
     * FORA MAIS FORTE
     */

    else if (
        diferenca < -0.12
    ) {

        candidatos = [

            "0:1",
            "0:2",
            "1:2",
            "0:3",
            "1:3",
            "2:3",
            "1:4",
            "2:4",
            "1:1",
            "2:2"

        ];

    }


    /*
     * EQUILIBRADO
     */

    else {

        candidatos = [

            "0:0",
            "1:0",
            "0:1",
            "1:1",
            "2:0",
            "0:2",
            "2:1",
            "1:2",
            "2:2",
            "3:1",
            "1:3",
            "3:2",
            "2:3",
            "3:3"

        ];

    }


    /*
     * REMOVER REPETIDOS
     */

    let disponiveis =
        candidatos.filter(
            placar =>
                !placaresUsados.includes(
                    placar
                )
        );


    /*
     * SE NÃO HOUVER,
     * USAR LISTA GERAL.
     */

    if (
        disponiveis.length === 0
    ) {

        disponiveis =
            PLACARES_PROVAVEIS.filter(
                placar =>
                    !placaresUsados.includes(
                        placar
                    )
            );

    }


    /*
     * ÚLTIMO FALLBACK
     */

    if (
        disponiveis.length === 0
    ) {

        disponiveis =
            PLACARES_PROVAVEIS.slice();

    }


    /*
     * ESCOLHER
     */

    const indice =
        Math.floor(
            Math.random() *
            disponiveis.length
        );


    const placar =
        disponiveis[
            indice
        ];


    placaresUsados.push(
        placar
    );


    const partes =
        placar.split(
            ":"
        );


    jogo.palpite = {

        golsCasa:
            Number(
                partes[0]
            ),

        golsFora:
            Number(
                partes[1]
            )

    };


    return jogo;

}


/* =====================================================
   FORÇA DO TIME
===================================================== */

function obterForca(
    time
) {

    if (!time) {

        return 1;

    }


    let forca =
        1;


    if (
        time.winner === true
    ) {

        forca +=
            0.20;

    }


    if (
        time.winner === false
    ) {

        forca -=
            0.10;

    }


    /*
     * Variação para evitar
     * resultados idênticos.
     */

    forca +=
        Math.random() *
        0.30 -
        0.15;


    return forca;

}

/* =====================================================
   GERAR IMAGEM
===================================================== */

async function gerarImagem() {

    if (
        jogosSelecionados.length === 0
    ) {

        mostrarMensagem(
            "Gere os 6 palpites primeiro."
        );

        return;

    }


    const arte =
        document.getElementById(
            "arte"
        );


    if (!arte) {

        mostrarMensagem(
            "Área da imagem não encontrada."
        );

        return;

    }


    try {

        await esperarImagens(
            arte
        );


        if (
            typeof html2canvas !==
            "function"
        ) {

            throw new Error(
                "HTML2Canvas não foi carregado."
            );

        }


        const canvas =
            await html2canvas(
                arte,
                {

                    backgroundColor:
                        "#061109",

                    scale:
                        2,

                    useCORS:
                        true,

                    allowTaint:
                        false,

                    logging:
                        false

                }
            );


        imagemGerada =
            canvas;


        mostrarMensagemTemporaria(
            "✅ Imagem gerada com sucesso!"
        );


    } catch (erro) {

        console.error(
            "Erro ao gerar imagem:",
            erro
        );


        mostrarMensagem(
            "Não foi possível gerar a imagem."
        );

    }

}


/* =====================================================
   ESPERAR IMAGENS
===================================================== */

function esperarImagens(
    container
) {

    const imagens =
        Array.from(
            container.querySelectorAll(
                "img"
            )
        );


    return Promise.all(

        imagens.map(
            img => {

                if (
                    img.complete
                ) {

                    return Promise.resolve();

                }


                return new Promise(
                    resolve => {

                        img.onload =
                            resolve;

                        img.onerror =
                            resolve;

                    }
                );

            }
        )

    );

}


/* =====================================================
   BAIXAR IMAGEM
===================================================== */

async function baixarImagem() {

    if (!imagemGerada) {

        await gerarImagem();

    }


    if (!imagemGerada) {

        return;

    }


    const campoData =
        document.getElementById(
            "dataJogo"
        );


    const data =
        campoData?.value
            ?.replaceAll(
                "-",
                ""
            ) ||
        "jogos";


    const link =
        document.createElement(
            "a"
        );


    link.download =
        `palpite-certo-${data}.png`;


    link.href =
        imagemGerada.toDataURL(
            "image/png"
        );


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}


/* =====================================================
   COMPARTILHAR WHATSAPP
===================================================== */

async function compartilharWhatsApp() {

    if (!imagemGerada) {

        await gerarImagem();

    }


    if (!imagemGerada) {

        return;

    }


    try {

        const blob =
            await new Promise(
                resolve => {

                    imagemGerada.toBlob(
                        resolve,
                        "image/png"
                    );

                }
            );


        if (!blob) {

            throw new Error(
                "Não foi possível criar a imagem."
            );

        }


        const arquivo =
            new File(
                [
                    blob
                ],
                "palpite-certo.png",
                {
                    type:
                        "image/png"
                }
            );


        /*
         * COMPARTILHAMENTO NATIVO
         */

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files: [
                    arquivo
                ]
            })
        ) {

            await navigator.share({

                title:
                    "Palpite Certo",

                text:
                    gerarTextoWhatsApp(),

                files: [
                    arquivo
                ]

            });


            return;

        }


        /*
         * FALLBACK
         */

        await baixarImagem();


        const texto =
            encodeURIComponent(
                gerarTextoWhatsApp()
            );


        window.open(
            "https://wa.me/?text=" +
            texto,
            "_blank"
        );


    } catch (erro) {

        console.log(
            "Compartilhamento cancelado:",
            erro
        );

    }

}


/* =====================================================
   TEXTO WHATSAPP
===================================================== */

function gerarTextoWhatsApp() {

    let texto =
        "⚽ *PALPITE CERTO*\n\n";


    jogosSelecionados.forEach(
        (jogo, index) => {

            const casa =
                jogo?.teams?.home?.name ||
                "Casa";


            const fora =
                jogo?.teams?.away?.name ||
                "Fora";


            const golsCasa =
                jogo?.palpite?.golsCasa ??
                0;


            const golsFora =
                jogo?.palpite?.golsFora ??
                0;


            texto +=
                `${index + 1}. ` +
                `${casa} x ${fora}\n` +
                `🎯 Placar provável: ` +
                `${golsCasa}:${golsFora}\n\n`;

        }
    );


    return texto;

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(
    data
) {

    if (!data) {

        return "";

    }


    const partes =
        data.split("-");


    if (
        partes.length !== 3
    ) {

        return data;

    }


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =====================================================
   FORMATAR HORA
===================================================== */

function formatarHora(
    dataISO
) {

    if (!dataISO) {

        return "--:--";

    }


    try {

        const data =
            new Date(
                dataISO
            );


        return data.toLocaleTimeString(
            "pt-BR",
            {

                hour:
                    "2-digit",

                minute:
                    "2-digit",

                timeZone:
                    TIMEZONE

            }
        );


    } catch {

        return "--:--";

    }

}


/* =====================================================
   ABREVIAR TIME
===================================================== */

function abreviarTime(
    nome
) {

    if (!nome) {

        return "";

    }


    nome =
        String(
            nome
        ).trim();


    if (
        nome.length <= 15
    ) {

        return nome;

    }


    const palavras =
        nome.split(
            /\s+/
        );


    if (
        palavras.length >= 2
    ) {

        return palavras
            .slice(
                0,
                2
            )
            .map(
                palavra =>
                    palavra.substring(
                        0,
                        10
                    )
            )
            .join(" ");

    }


    return nome.substring(
        0,
        15
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    valor
) {

    return String(
        valor ?? ""
    )

    .replaceAll(
        "&",
        "&amp;"
    )

    .replaceAll(
        "<",
        "&lt;"
    )

    .replaceAll(
        ">",
        "&gt;"
    )

    .replaceAll(
        '"',
        "&quot;"
    )

    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =====================================================
   ESCAPAR ATRIBUTO
===================================================== */

function escaparAtributo(
    valor
) {

    return escaparHTML(
        valor
    );

}
