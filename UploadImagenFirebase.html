<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Upload Times</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
  text-align: center;
  padding: 20px;
  margin: 0;
}

.box {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  max-width: 450px;
  margin: auto;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

h2 {
  margin-top: 0;
}

h3 {
  margin-bottom: 15px;
}

input[type="file"] {
  width: 100%;
  padding: 10px;
  background: #0f172a;
  border: 1px solid #334155;
  color: white;
  border-radius: 8px;
}

button {
  padding: 11px 15px;
  background: #22c55e;
  border: none;
  color: white;
  border-radius: 7px;
  cursor: pointer;
  margin-top: 8px;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}

#preview {
  margin: 15px auto;
  width: 130px;
  height: 130px;
  object-fit: contain;
  background: white;
  border-radius: 10px;
  padding: 5px;
  display: none;
}

#link {
  margin-top: 10px;
  word-break: break-all;
  font-size: 12px;
  color: #94a3b8;
}

.lista {
  margin-top: 25px;
  text-align: left;
}

.item {
  background: #0f172a;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
  border: 1px solid #334155;
  position: relative;
}

.item strong {
  display: block;
  text-align: center;
  font-size: 17px;
  margin-bottom: 8px;
}

.item img {
  display: block;
  width: 120px;
  height: 120px;
  object-fit: contain;
  background: white;
  border-radius: 10px;
  padding: 5px;
  margin: 10px auto;
}

.item small {
  display: block;
  color: #94a3b8;
  font-size: 11px;
  word-break: break-all;
  margin-top: 8px;
}

.copy-btn {
  width: 100%;
  background: #3b82f6;
}

.delete-btn {
  position: absolute;
  top: 8px;
  right: 8px;

  width: 30px;
  height: 30px;

  padding: 0;
  margin: 0;

  border-radius: 50%;
  background: #ef4444;

  font-size: 16px;
  line-height: 30px;
}

.clear-btn {
  background: #ef4444;
  width: 100%;
  margin-bottom: 15px;
}

.status {
  font-size: 13px;
  color: #94a3b8;
  margin-top: 10px;
}

.empty {
  text-align: center;
  color: #64748b;
  padding: 20px;
}
.pesquisa {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #0f172a;
  border: 1px solid #334155;
  border-radius: 8px;
  padding: 0 12px;
  margin-bottom: 15px;
}

.pesquisa span {
  font-size: 18px;
}

.pesquisa input {
  width: 100%;
  padding: 12px 5px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
}

.pesquisa input::placeholder {
  color: #64748b;
}
</style>

</head>

<body>

<div class="box">

  <h2>⚽ Upload de Times</h2>

  <input
    type="file"
    id="file"
    accept="image/*"
  >

  <br>

  <button onclick="enviar()">
    📤 Enviar Imagem
  </button>

  <img id="preview">

  <p id="link"></p>

  <p id="status" class="status"></p>

  <button onclick="copiar()">
    📋 Copiar Último Link
  </button>

  <div class="lista">
<div class="pesquisa">
  <span>🔍</span>
  <input
    type="text"
    id="pesquisaTime"
    placeholder="Pesquisar time pelo nome..."
    oninput="pesquisarTimes()"
  >
</div>
    <h3>📌 Lista de Times</h3>

    <button
      class="clear-btn"
      onclick="limparLista()"
    >
      🗑️ Limpar Lista
    </button>

    <div id="listaLinks"></div>

  </div>

</div>

<script>

/* =========================
   CLOUDINARY
========================= */

const CLOUD_NAME = "dtw3turzb";
const PRESET = "Newtech";


/* =========================
   VARIÁVEIS
========================= */

let urlFinal = "";

let lista =
  JSON.parse(
    localStorage.getItem("listaTimes")
  ) || [];


/* =========================
   LIMPAR NOME
========================= */

function limparNome(nome) {

  return nome
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-z0-9\s-]/g, "")
    .trim()
    .replace(/\s+/g, "-");

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(texto) {

  return String(texto)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================
   SALVAR LISTA
========================= */

function salvarLista() {

  localStorage.setItem(
    "listaTimes",
    JSON.stringify(lista)
  );

}


/* =========================
   ATUALIZAR LISTA
========================= */

function atualizarLista(listaExibida = lista) {

  const container =
    document.getElementById("listaLinks");

  container.innerHTML = "";

  if (listaExibida.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Nenhum time encontrado.
      </div>
    `;

    return;
  }

  listaExibida.forEach((item) => {

    const index = lista.indexOf(item);

    const div =
      document.createElement("div");

    div.className = "item";

    const nome =
      escaparHTML(item.nome);

    const url =
      escaparHTML(item.url);

    div.innerHTML = `

      <button
        class="delete-btn"
        onclick="excluirItem(${index})"
        title="Excluir"
      >
        ✕
      </button>

      <strong>
        ⚽ ${nome}
      </strong>

      <img
        src="${url}"
        alt="${nome}"
      >

      <small>
        ${url}
      </small>

      <button
        class="copy-btn"
        onclick="copiarItem(${index})"
      >
        📋 Copiar Link
      </button>

    `;

    container.appendChild(div);

  });

}
function pesquisarTimes() {

  const texto =
    document
      .getElementById("pesquisaTime")
      .value
      .toLowerCase()
      .trim();

  if (!texto) {

    atualizarLista(lista);

    return;
  }

  const resultados =
    lista.filter(item =>
      item.nome
        .toLowerCase()
        .includes(texto)
    );

  atualizarLista(resultados);

}
/* =========================
   ENVIAR IMAGEM
========================= */

async function enviar() {

  const fileInput =
    document.getElementById("file");

  const file =
    fileInput.files[0];


  if (!file) {

    alert("Escolha uma imagem primeiro!");

    return;
  }


  if (!file.type.startsWith("image/")) {

    alert("Escolha um arquivo de imagem!");

    return;
  }


  let nome =
    prompt(
      "Digite o nome do time:"
    );


  if (!nome || nome.trim() === "") {

    nome =
      file.name
        .split(".")[0];

  }


  nome =
    limparNome(nome);


  if (!nome) {

    alert("Digite um nome válido!");

    return;
  }


  const status =
    document.getElementById("status");


  status.innerText =
    "⏳ Enviando imagem...";


  try {

    const formData =
      new FormData();


    formData.append(
      "file",
      file
    );


    formData.append(
      "upload_preset",
      PRESET
    );


    formData.append(
      "public_id",
      nome
    );


    const res =
      await fetch(

        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,

        {
          method: "POST",
          body: formData
        }

      );


    const data =
      await res.json();


    if (data.error) {

      throw new Error(
        data.error.message
      );

    }


    urlFinal =
      data.secure_url;


    /* =========================
       MOSTRAR PRÉVIA
    ========================= */

    const preview =
      document.getElementById("preview");


    preview.src =
      urlFinal;


    preview.style.display =
      "block";


    /* =========================
       MOSTRAR LINK
    ========================= */

    document.getElementById("link")
      .innerText =
      urlFinal;


    /* =========================
       ADICIONAR À LISTA
    ========================= */

    lista.push({

      nome: nome,

      url: urlFinal

    });


    salvarLista();

    atualizarLista();


    status.innerText =
      "✅ Imagem enviada com sucesso!";


    fileInput.value = "";


  } catch (erro) {

    console.error(erro);


    status.innerText =
      "❌ Erro ao enviar imagem.";


    alert(
      "Erro ao enviar: " +
      erro.message
    );

  }

}


/* =========================
   COPIAR ÚLTIMO LINK
========================= */

function copiar() {

  if (!urlFinal) {

    alert(
      "Nenhum link disponível!"
    );

    return;
  }


  navigator.clipboard
    .writeText(urlFinal)
    .then(() => {

      alert(
        "✅ Link copiado!"
      );

    })
    .catch(() => {

      alert(
        "Não foi possível copiar."
      );

    });

}


/* =========================
   COPIAR ITEM
========================= */

function copiarItem(index) {

  const item =
    lista[index];


  if (!item) return;


  navigator.clipboard
    .writeText(item.url)
    .then(() => {

      alert(
        "✅ Link copiado!"
      );

    })
    .catch(() => {

      alert(
        "Não foi possível copiar."
      );

    });

}


/* =========================
   EXCLUIR ITEM
========================= */

function excluirItem(index) {

  const item = lista[index];

  if (!item) return;

  const confirmar =
    confirm(
      `Excluir "${item.nome}" da lista?`
    );

  if (!confirmar) return;

  lista.splice(index, 1);

  salvarLista();

  // Mantém a pesquisa ativa
  pesquisarTimes();

  // Se não houver mais nenhum time
  if (lista.length === 0) {

    urlFinal = "";

    document.getElementById("preview")
      .style.display = "none";

    document.getElementById("link")
      .innerText = "";

  }

}
/* =========================
   LIMPAR TODA A LISTA
========================= */

function limparLista() {

  if (lista.length === 0) {

    alert(
      "A lista já está vazia."
    );

    return;
  }


  const confirmar =
    confirm(
      "Tem certeza que deseja excluir TODAS as imagens da lista?"
    );


  if (!confirmar) return;


  lista = [];

  urlFinal = "";


  localStorage.removeItem(
    "listaTimes"
  );


  document.getElementById("preview")
    .style.display =
    "none";


  document.getElementById("link")
    .innerText = "";


  document.getElementById("status")
    .innerText =
    "🗑️ Lista limpa.";


  atualizarLista();

}


/* =========================
   PRÉVIA ANTES DO UPLOAD
========================= */

document
  .getElementById("file")
  .addEventListener(
    "change",
    function() {

      const file =
        this.files[0];


      if (!file) return;


      if (
        !file.type.startsWith("image/")
      ) {

        alert(
          "Selecione uma imagem válida."
        );

        this.value = "";

        return;
      }


      const reader =
        new FileReader();


      reader.onload =
        function(e) {

          const preview =
            document.getElementById(
              "preview"
            );


          preview.src =
            e.target.result;


          preview.style.display =
            "block";

        };


      reader.readAsDataURL(file);

    }
  );


/* =========================
   CARREGAR LISTA AO ABRIR
========================= */

atualizarLista();

</script>

</body>
</html>
