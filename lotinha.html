ut::placeholder{ color:#aaa; } /* ============================== QUANTIDADE DE NÚMEROS ============================== */ .titulo-jogo{ text-align:center; font-size:13px; font-weight:bold; margin-bottom:7px; color:#fff; } .button-container{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:12px; } .button-container button{ width:100%; min-width:0; padding:6px 2px; border:1px solid #ffdd00; border-radius:7px; background:#050505; color:#fff; cursor:pointer; box-shadow:0 2px 5px rgba(0,0,0,.35); } .button-container button:active{ transform:scale(.94); } .button-container button span.tipo{ display:block; font-size:15px; font-weight:900; } .button-container button span.valor{ display:block; margin-top:2px; font-size:8px; color:#ffdd00; font-weight:bold; } /* ============================== ÁREA DOS 25 NÚMEROS ============================== */ .numeros-box{ background:rgba(0,0,0,.35); border-radius:12px; padding:8px; border:1px solid rgba(255,221,0,.5); } .numeros-titulo{ text-align:center; font-size:13px; font-weight:bold; margin-bottom:7px; color:#ffdd00; } /* IMPORTANTE: 5 COLUNAS TODOS OS 25 NÚMEROS NA TELA */ .linha-numeros{ display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-bottom:5px; } .linha-numeros:last-child{ margin-bottom:0; } .number-button{ width:100%; height:auto; aspect-ratio:1 / 1; border:2px solid #ffdd00; border-radius:8px; background:#050505; color:#fff; font-size:18px; font-weight:900; cursor:pointer; transition: transform .15s, background .15s, box-shadow .15s; } .number-button:active{ transform:scale(.92); } .number-button:hover{ background:#222; } /* NÚMERO SELECIONADO */ .number-button.selecionado{ background:linear-gradient(145deg,#00e676,#008f3d); border-color:#7cffb2; box-shadow: 0 0 8px rgba(0,255,127,.7), inset 0 0 8px rgba(255,255,255,.2); color:#fff; } /* ============================== RESULTADOS ============================== */ .info-box{ margin-top:10px; background:#050505; border-radius:10px; padding:9px; border:1px solid #ffdd00; } .resultado{ margin:3px 0; font-size:14px; font-weight:bold; } #contadorSelecionados{ color:#ffdd00; } #resultado{ color:#fff; } /* ============================== WHATSAPP ============================== */ .btn-whatsapp{ width:100%; margin-top:10px; padding:12px; border:none; border-radius:10px; background:#25d366; color:#fff; font-size:16px; font-weight:900; cursor:pointer; box-shadow:0 4px 8px rgba(0,0,0,.35); } .btn-whatsapp:active{ transform:scale(.97); } /* ============================== MODAL ============================== */ .modal{ display:none; position:fixed; z-index:9999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,.8); } .modal-content{ width:85%; max-width:320px; margin:35% auto; padding:20px; background:#fff; color:#000; border-radius:14px; text-align:center; } .close{ float:right; font-size:28px; font-weight:bold; cursor:pointer; } /* ============================== CELULAR PEQUENO ============================== */ @media(max-width:360px){ body{ padding:5px; } .container{ padding:10px; } .logo h1{ font-size:27px; } .number-button{ font-size:15px; border-width:1px; border-radius:6px; } .linha-numeros{ gap:4px; margin-bottom:4px; } .button-container{ gap:3px; } .button-container button span.tipo{ font-size:13px; } .button-container button span.valor{ font-size:7px; } } </style> <!-- FIREBASE --> <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-app-compat.js"></script> <script src="https://www.gstatic.com/firebasejs/11.9.1/firebase-database-compat.js"></script> <script> const firebaseConfig = { databaseURL:"https://loteriasmj-274f9-default-rtdb.firebaseio.com/" }; firebase.initializeApp(firebaseConfig); const database = firebase.database(); </script> </head> <body> <div class="container"> <!-- CABEÇALHO --> <div class="logo"> <h1>🍀 LOTINHA</h1> <p>JOGUE DE 17 A 23 NÚMEROS</p> </div> <!-- JOGOS --> <div class="game-buttons"> <button onclick="supermania()"> SUPER MANIA </button> <button onclick="seninha()"> SENINHA </button> <button onclick="quininha()"> QUININHA </button> </div> <!-- VALOR --> <div class="input-valor"> <input type="number" id="valorAposta" placeholder="Valor da aposta" min="0" step="0.01" > </div> <!-- QUANTIDADES --> <div class="titulo-jogo"> ESCOLHA A QUANTIDADE </div> <div class="button-container" id="buttonContainer"> </div> <!-- NÚMEROS --> <div class="numeros-box"> <div class="numeros-titulo"> 🔢 MARQUE SEUS NÚMEROS </div> <div id="checkboxContainer"></div> </div> <!-- INFORMAÇÕES --> <div class="info-box"> <div class="resultado" id="contadorSelecionados"> Números Marcados: 0 </div> <div class="resultado" id="resultado"> Total a Receber: R$ 0,00 </div> </div> <!-- WHATSAPP --> <button class="btn-whatsapp" onclick="enviarWhatsapp()"> 📲 ENVIAR APOSTA </button> </div> <!-- MODAL --> <div id="myModal" class="modal"> <div class="modal-content"> <span class="close" onclick="fecharModal()"> &times; </span> <h3> 🕐 Aguarde </h3> <p> Acessando o servidor... </p> </div> </div> <script> /* ========================================= CONFIGURAÇÕES ========================================= */ const valores = { 17:7000, 18:1300, 19:300, 20:100, 21:30, 22:10, 23:4 }; const gruposValidos = [ 17, 18, 19, 20, 21, 22, 23 ]; const resultado = "www.oresultado.com.br"; let tipoSelecionado = null; /* ========================================= ELEMENTOS ========================================= */ const buttonContainer = document.getElementById( "buttonContainer" ); const resultadoDiv = document.getElementById( "resultado" ); const contadorDiv = document.getElementById( "contadorSelecionados" ); const inputValor = document.getElementById( "valorAposta" ); const container = document.getElementById( "checkboxContainer" ); /* ========================================= BOTÕES 17 ATÉ 23 ========================================= */ gruposValidos.forEach(tipo => { const btn = document.createElement("button"); btn.innerHTML = ` <span class="tipo">${tipo}</span> <span class="valor"> R$ ${valores[tipo].toLocaleString( "pt-BR" )} </span> `; btn.onclick = () => executarJogo(tipo); buttonContainer.appendChild(btn); }); /* ========================================= CRIAR 25 NÚMEROS ========================================= */ for(let i=1; i<=25; i+=5){ const linha = document.createElement("div"); linha.className = "linha-numeros"; for( let j=i; j<i+5 && j<=25; j++ ){ const numero = j.toString().padStart(2,"0"); const btn = document.createElement("button"); btn.className = "number-button"; btn.id = "num"+numero; btn.textContent = numero; btn.addEventListener( "click", () => { btn.classList.toggle( "selecionado" ); const selecionados = document.querySelectorAll( ".number-button.selecionado" ); if( selecionados.length > 23 ){ btn.classList.remove( "selecionado" ); alert( "⚠️ Máximo de 23 números!" ); } atualizarContador(); } ); linha.appendChild(btn); } container.appendChild(linha); } /* ========================================= CONTADOR ========================================= */ function atualizarContador(){ const selecionados = document.querySelectorAll( ".number-button.selecionado" ); const quantidade = selecionados.length; contadorDiv.textContent = `Números Marcados: ${quantidade}`; if( quantidade < 17 || quantidade > 23 ){ resultadoDiv.textContent = "⚠️ Marque entre 17 e 23 números."; tipoSelecionado = null; return; } tipoSelecionado = quantidade; const valorDigitado = parseFloat( inputValor.value ); if( isNaN(valorDigitado) || valorDigitado <= 0 ){ resultadoDiv.textContent = "Total a Receber: R$ 0,00"; return; } const totalReceber = valorDigitado * valores[quantidade]; resultadoDiv.textContent = `Total a Receber: R$ ${ totalReceber.toLocaleString( "pt-BR", { minimumFractionDigits:2 } ) }`; } /* ========================================= ATUALIZAR AO DIGITAR VALOR ========================================= */ inputValor.addEventListener( "input", atualizarContador ); /* ========================================= JOGO AUTOMÁTICO ========================================= */ function executarJogo(tipo){ const valorDigitado = parseFloat( inputValor.value ); if( isNaN(valorDigitado) || valorDigitado <= 0 ){ alert( "Por favor, digite um valor válido para a aposta." ); return; } tipoSelecionado = tipo; document .querySelectorAll( ".number-button" ) .forEach(btn => { btn.classList.remove( "selecionado" ); }); const numeros = []; while( numeros.length < tipo ){ const num = ( Math.floor( Math.random()*25 )+1 ) .toString() .padStart(2,"0"); if( !numeros.includes(num) ){ numeros.push(num); document .getElementById( "num"+num ) .classList.add( "selecionado" ); } } atualizarContador(); } /* ========================================= MODAL ========================================= */ function abrirModal(){ document .getElementById("myModal") .style.display="block"; } function fecharModal(){ document .getElementById("myModal") .style.display="none"; } /* ========================================= CÓDIGO DE CONTROLE ========================================= */ function gerarNumeroControle(){ return Math.floor( 100000 + Math.random()*900000 ); } /* ========================================= WHATSAPP ========================================= */ function enviarWhatsapp(){ const hoje = new Date().getDay(); if(hoje === 0){ alert( "⚠️ Apostas permitidas apenas de Segunda a Sábado." ); return; } const selecionados = Array.from( document.querySelectorAll( ".number-button.selecionado" ) ).map( btn => btn.textContent ); const valorDigitado = parseFloat( inputValor.value ); if( !gruposValidos.includes( selecionados.length ) || isNaN(valorDigitado) || valorDigitado <= 0 ){ alert( "⚠️ Selecione de 17 a 23 números e um valor válido!" ); return; } const total = ( valorDigitado * valores[selecionados.length] ).toLocaleString( "pt-BR", { minimumFractionDigits:2 } ); const numeroControle = gerarNumeroControle(); const dadosAposta = { nomeJogo:"LOTINHA", numeros: selecionados, quantidade: selecionados.length, valorDigitado: valorDigitado.toFixed(2), totalReceber: total, dataHora: new Date().toLocaleString( "pt-BR" ), numeroControle, resultadoLink: resultado }; firebase .database() .ref( `apostas/LOTINHA/${numeroControle}` ) .set(dadosAposta); abrirModal(); setTimeout(() => { const mensagem = `             📝 *LOTINHA* 
🔢 *Código da Aposta:* ${numeroControle}

🏆 *Possível prêmio:* R$ ${total}`; window.open( `https://api.whatsapp.com/send?phone=5571992290058&text=${encodeURIComponent(mensagem)}`, "_blank" ); fecharModal(); },2000); } /* ========================================= NAVEGAÇÃO ========================================= */ function supermania(){ window.location.href = "https://supermania.netlify.app/supermania"; } function seninha(){ window.location.href = "https://supermania.netlify.app/seninha"; } function quininha(){ window.location.href = "https://supermania.netlify.app/quininha"; } </script> </body> </html>
