<script>

/* =====================================================
FIREBASE
===================================================== */

const firebaseConfig = {

apiKey:
"AIzaSyAGOy5lPtqjSTtZpyFX7xtGGy3P2nYA77U",

authDomain:
"placarexato-97966.firebaseapp.com",

databaseURL:
"https://placarexato-97966-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"placarexato-97966",

storageBucket:
"placarexato-97966.firebasestorage.app",

messagingSenderId:
"942191850183",

appId:
"1:942191850183:web:9870fab0d09044b11004e2"

};

firebase.initializeApp(firebaseConfig);

const db =
firebase.database();

const jogadoresRef =
db.ref("jogadores");

const palpitesRef =
db.ref("palpites");

const recargasRef =
db.ref("solicitacoesRecarga");


/* =====================================================
ELEMENTOS
===================================================== */

const nomeInput =
document.getElementById("nome");

const saldoInput =
document.getElementById("saldo");

const valorLiberacaoInput =
document.getElementById("valorLiberacao");

const premioInput =
document.getElementById("premio");

const btnSalvar =
document.getElementById("btnSalvar");

const btnLimpar =
document.getElementById("btnLimpar");

const jogadoresArea =
document.getElementById("jogadores");

const palpitesArea =
document.getElementById("palpites");

const filtroNome =
document.getElementById("filtroNome");


let jogadorEditando = null;

let listaPalpites = [];

let listaRecargas = [];


/* =====================================================
ESCAPE
===================================================== */

function escapeHTML(text){

return String(text ?? "")

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
DINHEIRO
===================================================== */

function dinheiro(valor){

return Number(valor || 0)

.toFixed(2)

.replace(".",",");

}


/* =====================================================
CRIAR ID
===================================================== */

function criarId(nome){

return String(nome)

.toLowerCase()

.normalize("NFD")

.replace(/[\u0300-\u036f]/g,"")

.replace(/[^a-z0-9]+/g,"_")

.replace(/^_+|_+$/g,"");

}


/* =====================================================
SALVAR JOGADOR
===================================================== */

async function salvarJogador(){

const nome =
nomeInput.value.trim();

const saldo =
Number(saldoInput.value);

const valorLiberacao =
Number(valorLiberacaoInput.value);

const premio =
Number(premioInput.value);


if(!nome){

alert("⚠️ Digite o nome do jogador.");

return;

}


if(!Number.isFinite(saldo) || saldo < 0){

alert("⚠️ Informe um saldo válido.");

return;

}


if(
!Number.isFinite(valorLiberacao) ||
valorLiberacao < 0
){

alert("⚠️ Informe um valor válido.");

return;

}


if(!Number.isFinite(premio) || premio < 0){

alert("⚠️ Informe um prêmio válido.");

return;

}


btnSalvar.disabled = true;

btnSalvar.textContent =
"⏳ SALVANDO...";


try{

let id =
jogadorEditando ||
criarId(nome);


await jogadoresRef
.child(id)
.update({

nome:nome,

saldo:
Number(saldo.toFixed(2)),

valorLiberacao:
Number(valorLiberacao.toFixed(2)),

premio:
Number(premio.toFixed(2)),

atualizadoEm:
Date.now()

});


alert("✅ Configuração salva!");

limparFormulario();


}catch(erro){

console.error(erro);

alert(
"❌ Erro:\n" +
erro.message
);

}


btnSalvar.disabled = false;

btnSalvar.textContent =
"💾 SALVAR CONFIGURAÇÃO";

}


/* =====================================================
LIMPAR
===================================================== */

function limparFormulario(){

jogadorEditando = null;

nomeInput.value = "";

saldoInput.value = "";

valorLiberacaoInput.value =
"2.00";

premioInput.value =
"1000.00";

btnSalvar.textContent =
"💾 SALVAR CONFIGURAÇÃO";

}


/* =====================================================
EDITAR
===================================================== */

async function editarJogador(id){

const snap =
await jogadoresRef
.child(id)
.once("value");

const jogador =
snap.val();


if(!jogador){

alert("Jogador não encontrado.");

return;

}


jogadorEditando = id;

nomeInput.value =
jogador.nome || "";

saldoInput.value =
jogador.saldo ?? 0;

valorLiberacaoInput.value =
jogador.valorLiberacao ?? 2;

premioInput.value =
jogador.premio ?? 1000;


btnSalvar.textContent =
"💾 ATUALIZAR JOGADOR";


window.scrollTo({

top:0,

behavior:"smooth"

});

}


/* =====================================================
LIBERAR
===================================================== */

async function liberarJogador(id){

const snap =
await jogadoresRef
.child(id)
.once("value");

const jogador =
snap.val();


if(!jogador){

alert("⚠️ Jogador não encontrado.");

return;

}


/*
PEGAR O VALOR REAL SOLICITADO
*/

const dados =
obterDadosJogador(id);

const valorSolicitado =
Number(dados.saldoSolicitado) || 0;


if(valorSolicitado <= 0){

alert(
"⚠️ Este jogador não possui uma solicitação de saldo."
);

return;

}


/*
CONFIRMAÇÃO
*/

const confirmar =
confirm(

"🔓 LIBERAR SALDO\n\n" +

"👤 Jogador: " +
jogador.nome +

"\n\n" +

"💰 VALOR SOLICITADO: R$ " +
dinheiro(valorSolicitado) +

"\n\n" +

"🎯 Valor mínimo: R$ " +
dinheiro(jogador.valorLiberacao) +

"\n\n" +

"Confirmar liberação de R$ " +
dinheiro(valorSolicitado) +
"?"

);


if(!confirmar){

return;

}


try{

/*
LIBERA EXATAMENTE O VALOR SOLICITADO
*/

await jogadoresRef
.child(id)
.update({

saldo:
Number(valorSolicitado.toFixed(2)),

saldoLiberado:
Number(valorSolicitado.toFixed(2)),

valorLiberado:
Number(valorSolicitado.toFixed(2)),

ultimaLiberacao:
Number(valorSolicitado.toFixed(2)),

liberado:true,

liberadoEm:
Date.now(),

atualizadoEm:
Date.now()

});


alert(

"✅ SALDO LIBERADO!\n\n" +

"👤 " +
jogador.nome +

"\n\n💰 Saldo liberado: R$ " +
dinheiro(valorSolicitado)

);


}catch(erro){

console.error(erro);

alert(
"❌ Erro ao liberar saldo:\n\n" +
erro.message
);

}

}


/* =====================================================
BLOQUEAR
===================================================== */

async function bloquearJogador(id){

const snap =
await jogadoresRef
.child(id)
.once("value");

const jogador =
snap.val();


if(!jogador) return;


await jogadoresRef
.child(id)
.update({

saldo:0,

atualizadoEm:
Date.now()

});


alert(
"🔒 " +
jogador.nome +
" foi bloqueado."
);

}


/* =====================================================
EXCLUIR
===================================================== */

async function excluirJogador(id){

const snap =
await jogadoresRef
.child(id)
.once("value");

const jogador =
snap.val();


if(!jogador) return;


if(!confirm(
"⚠️ EXCLUIR JOGADOR?\n\n" +
jogador.nome
)){

return;

}


await jogadoresRef
.child(id)
.remove();


if(jogadorEditando === id){

limparFormulario();

}


alert("✅ Jogador excluído.");

}


/* =====================================================
OBTER DADOS DO JOGADOR
===================================================== */

function obterDadosJogador(id){

let resultado = {

saldoSolicitado:0,

ultimaRecarga:0,

dataRecarga:"",

statusRecarga:"",

timestampPalpite:0,

timestampRecarga:0

};


/* =====================================================
PALPITES
===================================================== */

if(listaPalpites.length){

listaPalpites.forEach(function(item){

const p =
item.dados || {};

const jogadorId =
p.jogadorId ||
criarId(
p.nome ||
p.nomeJogador ||
p.usuario ||
""
);


if(jogadorId !== id){

return;

}


const timestamp =
Number(p.timestamp || 0);


/*
TENTA ENCONTRAR O VALOR REAL SOLICITADO
*/

const valoresPossiveis = [

p.saldoSolicitado,

p.valorSolicitado,

p.valorRecarga,

p.valorPedido,

p.valorSaldo,

p.valor

];


let valor = 0;


for(let i = 0; i < valoresPossiveis.length; i++){

const numero =
Number(valoresPossiveis[i]);

if(
Number.isFinite(numero) &&
numero > 0
){

valor = numero;

break;

}

}


if(
timestamp >=
resultado.timestampPalpite
){

resultado.saldoSolicitado =
valor;

resultado.timestampPalpite =
timestamp;

}

});

}


/* =====================================================
SOLICITAÇÕES DE RECARGA
===================================================== */

if(listaRecargas.length){

listaRecargas.forEach(function(item){

const r =
item.dados || {};

const jogadorId =
r.jogadorId ||
criarId(
r.nome ||
r.nomeJogador ||
r.usuario ||
""
);


if(jogadorId !== id){

return;

}


const timestamp =
Number(r.timestamp || 0);


/*
AQUI ESTÁ O VALOR QUE O JOGADOR
SOLICITOU PARA RECEBER NO SALDO
*/

const valorRecarga =
Number(
r.valorSolicitado ??
r.valor ??
r.valorRecarga ??
r.valorPedido ??
0
) || 0;


if(
timestamp >=
resultado.timestampRecarga
){

resultado.ultimaRecarga =
valorRecarga;

resultado.dataRecarga =
r.data || "";

resultado.statusRecarga =
r.status || "pendente";

resultado.timestampRecarga =
timestamp;

}

});

}


/* =====================================================
ESCOLHER O VALOR A LIBERAR
===================================================== */

/*
SE EXISTIR UMA RECARGA SOLICITADA,
ELA TEM PRIORIDADE.

Exemplo:

Palpite = R$ 2,00
Recarga = R$ 30,00

Saldo a liberar = R$ 30,00
*/

if(resultado.ultimaRecarga > 0){

resultado.saldoSolicitado =
resultado.ultimaRecarga;

}


return resultado;

}

/* =====================================================
CARREGAR JOGADORES
===================================================== */

function carregarJogadores(){

jogadoresRef.on(
"value",
function(snapshot){

jogadoresArea.innerHTML = "";


if(!snapshot.exists()){

jogadoresArea.innerHTML =
'<p class="sem">Nenhum jogador cadastrado.</p>';

return;

}


snapshot.forEach(function(child){

const jogador =
child.val();

const id =
child.key;


const saldo =
Number(jogador.saldo) || 0;

const liberacao =
Number(jogador.valorLiberacao) || 0;

const premio =
Number(jogador.premio) || 0;


const dadosExtras =
obterDadosJogador(id);


const saldoSolicitado =
dadosExtras.saldoSolicitado;

const ultimaRecarga =
dadosExtras.ultimaRecarga;

const dataRecarga =
dadosExtras.dataRecarga;

const statusRecarga =
dadosExtras.statusRecarga;


const liberado =
saldo >= liberacao;


const div =
document.createElement("div");

div.className =
"jogador";


let recargaHTML = "";


if(ultimaRecarga > 0){

recargaHTML = `

<div class="recarga">

💳 Última recarga solicitada:

<strong>
R$ ${dinheiro(ultimaRecarga)}
</strong>

<br>

📅 ${escapeHTML(dataRecarga)}

<br>

📌 Status:

<strong>
${escapeHTML(statusRecarga)}
</strong>

</div>

`;

}


div.innerHTML = `

<div class="jogador-topo">

<div class="nome">

👤
${escapeHTML(jogador.nome || "")}

</div>

<span class="${
liberado
?
"liberado"
:
"bloqueado"
}">

${
liberado
?
"🟢 LIBERADO"
:
"🔴 BLOQUEADO"
}

</span>

</div>


<div class="info">

💰 Saldo atual:

<strong>
R$ ${dinheiro(saldo)}
</strong>

<br>

💵 Saldo solicitado:

<strong class="solicitado">
R$ ${dinheiro(saldoSolicitado)}
</strong>

<br>

🎯 Para liberar:

<strong>
R$ ${dinheiro(liberacao)}
</strong>

<br>

🏆 Prêmio:

<strong>
R$ ${dinheiro(premio)}
</strong>

</div>


${recargaHTML}


<div class="acoes">

<button
class="btn-editar"
onclick="editarJogador('${id}')">

✏️ EDITAR

</button>


${
liberado

?

`<button
class="btn-bloquear"
onclick="bloquearJogador('${id}')">

🔒 BLOQUEAR

</button>`

:

`<button
class="btn-liberar"
onclick="liberarJogador('${id}')">

🔓 LIBERAR R$ ${dinheiro(saldoSolicitado)}

</button>`
}


<button
class="btn-excluir"
onclick="excluirJogador('${id}')">

🗑️ EXCLUIR

</button>

</div>

`;


jogadoresArea.appendChild(div);

});

});

}


/* =====================================================
NOME DO JOGO
===================================================== */

function pegarNomeJogo(jogo){

if(!jogo){

return "Jogo não informado";

}


if(
jogo.confronto &&
String(jogo.confronto).trim()
){

return String(jogo.confronto).trim();

}


if(
jogo.casa &&
jogo.fora
){

return (

String(jogo.casa).trim() +

" x " +

String(jogo.fora).trim()

);

}


if(jogo.time){

return jogo.time;

}


if(jogo.nome){

return jogo.nome;

}


if(jogo.jogo){

return jogo.jogo;

}


if(jogo.partida){

return jogo.partida;

}


return "Jogo não informado";

}


/* =====================================================
PALPITE
===================================================== */

function pegarPalpite(jogo){

if(!jogo){

return "-";

}


if(
jogo.palpite !== undefined &&
jogo.palpite !== null
){

return jogo.palpite;

}


if(
jogo.placar !== undefined
){

return jogo.placar;

}


if(
jogo.resultado !== undefined
){

return jogo.resultado;

}


return "-";

}


/* =====================================================
RESULTADO
===================================================== */

function pegarResultado(item,numero){

if(
item.resultados &&
item.resultados["jogo"+numero]
){

return item.resultados["jogo"+numero];

}


return "- : -";

}


/* =====================================================
STATUS
===================================================== */

function statusTexto(status){

if(status === "ganhou"){

return `
<div class="status-palpite status-ganhou">
🟢 GANHOU
</div>
`;

}


if(status === "perdeu"){

return `
<div class="status-palpite status-perdeu">
🔴 PERDEU
</div>
`;

}


return `
<div class="status-palpite status-aguardando">
🟡 AGUARDANDO RESULTADO
</div>
`;

}


/* =====================================================
CARREGAR PALPITES
===================================================== */

function carregarPalpites(){

palpitesRef.on(
"value",
function(snapshot){

listaPalpites = [];


if(snapshot.exists()){

snapshot.forEach(function(child){

listaPalpites.push({

id:child.key,

dados:child.val()

});

});

}


listaPalpites.sort(function(a,b){

return (

Number(b.dados?.timestamp || 0)

-

Number(a.dados?.timestamp || 0)

);

});


renderizarPalpites();

carregarJogadores();

});

}


/* =====================================================
CARREGAR RECARGAS
===================================================== */

function carregarRecargas(){

recargasRef.on(
"value",
function(snapshot){

listaRecargas = [];


if(snapshot.exists()){

snapshot.forEach(function(child){

listaRecargas.push({

id:child.key,

dados:child.val()

});

});

}


listaRecargas.sort(function(a,b){

return (

Number(b.dados?.timestamp || 0)

-

Number(a.dados?.timestamp || 0)

);

});


carregarJogadores();

});

}


/* =====================================================
RENDERIZAR PALPITES
===================================================== */

function renderizarPalpites(){

palpitesArea.innerHTML = "";


let lista =
listaPalpites;


const filtro =
filtroNome.value
.trim()
.toLowerCase();


if(filtro){

lista =
lista.filter(function(item){

const nome =
String(
item.dados?.nome ||
""
).toLowerCase();

return nome.includes(filtro);

});

}


if(lista.length === 0){

palpitesArea.innerHTML =
'<p class="sem">Nenhum palpite encontrado.</p>';

return;

}


lista.forEach(function(item){

const p =
item.dados || {};

const id =
item.id;


const nome =
p.nome ||
p.nomeJogador ||
p.usuario ||
"Jogador";


const status =
p.status ||
"aguardando";


const jogos = [

p.jogo1,
p.jogo2,
p.jogo3,
p.jogo4,
p.jogo5

];


let jogosHTML = "";


jogos.forEach(function(jogo,index){

if(!jogo){

return;

}


const numero =
index + 1;

const nomeJogo =
pegarNomeJogo(jogo);

const palpite =
pegarPalpite(jogo);

const resultado =
pegarResultado(
p,
numero
);


jogosHTML += `

<div class="palpite">

<div class="jogo">

⚽ <strong>JOGO ${numero}</strong>

<br>

<span>

${escapeHTML(nomeJogo)}

</span>

</div>


<div>

🎯 Palpite:

<strong>
${escapeHTML(palpite)}
</strong>

</div>


<div class="resultado-box">

<label>

📊 Resultado real do jogo ${numero}

</label>


<input

class="resultado-input"

id="resultado_${id}_${numero}"

value="${
escapeHTML(
resultado === "- : -"
?
""
:
resultado
)
}"

placeholder="Ex: 2:1"


<button

class="btn-resultado"

onclick="salvarResultado(
'${id}',
${numero}
)">

💾 SALVAR RESULTADO

</button>

</div>

</div>

`;

});


const div =
document.createElement("div");

div.className =
"jogador";


div.innerHTML = `

<div class="jogador-topo">

<div class="nome">

👤 ${escapeHTML(nome)}

</div>

<div>

${statusTexto(status)}

</div>

</div>


${jogosHTML}


<div class="info">

💵 Saldo solicitado:

<strong>
R$ ${dinheiro(p.valor)}
</strong>

<br>

💳 Saldo anterior:

<strong>
R$ ${dinheiro(p.saldoAnterior)}
</strong>

<br>

🏆 Prêmio:

<strong>
R$ ${dinheiro(p.premio)}
</strong>

<br>

💰 Saldo restante:

<strong>
R$ ${dinheiro(p.saldoRestante)}
</strong>

<br>

📅 Enviado:

${escapeHTML(p.data || "")}

</div>


<div class="acoes">

<button
class="btn-ganhou"
onclick="alterarStatus(
'${id}',
'ganhou'
)">

🟢 GANHOU

</button>


<button
class="btn-perdeu"
onclick="alterarStatus(
'${id}',
'perdeu'
)">

🔴 PERDEU

</button>


<button
class="btn-excluir"
onclick="excluirPalpite(
'${id}'
)">

🗑️ EXCLUIR

</button>

</div>

`;


palpitesArea.appendChild(div);

});

}


/* =====================================================
SALVAR RESULTADO
===================================================== */

async function salvarResultado(
palpiteId,
numero
){

const input =
document.getElementById(
`resultado_${palpiteId}_${numero}`
);

if(!input){

return;

}


const resultado =
input.value.trim();


if(!resultado){

alert(
"⚠️ Informe o resultado. Exemplo: 2:1"
);

return;

}


if(
!/^\d+\s*:\s*\d+$/.test(resultado)
){

alert(
"⚠️ Use o formato correto.\n\nExemplo: 2:1"
);

return;

}


try{

await palpitesRef
.child(palpiteId)
.child("resultados")
.child("jogo"+numero)
.set(resultado);


alert(
"✅ Resultado do jogo " +
numero +
" salvo!"
);


}catch(erro){

console.error(erro);

alert(
"❌ Erro ao salvar resultado."
);

}

}


/* =====================================================
ALTERAR STATUS
===================================================== */

async function alterarStatus(
id,
status
){

try{

await palpitesRef
.child(id)
.update({

status:status,

statusAtualizadoEm:
Date.now()

});


if(status === "ganhou"){

alert(
"🟢 Palpite marcado como GANHOU."
);

}else{

alert(
"🔴 Palpite marcado como PERDEU."
);

}


}catch(erro){

console.error(erro);

alert(
"❌ Erro ao atualizar status."
);

}

}


/* =====================================================
EXCLUIR PALPITE
===================================================== */

async function excluirPalpite(id){

if(!confirm(
"⚠️ Deseja excluir este palpite?"
)){

return;

}


try{

await palpitesRef
.child(id)
.remove();

alert(
"✅ Palpite excluído."
);

}catch(erro){

console.error(erro);

alert(
"❌ Não foi possível excluir o palpite."
);

}

}

carregarPalpites();
