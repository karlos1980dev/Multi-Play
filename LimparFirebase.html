<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>


<script>

/* =========================================================
   FIREBASE PRINCIPAL
========================================================= */

const firebaseConfigPrincipal = {

    apiKey:
        "AIzaSyA5a-2HzvcljnAfXE7P3ThDnq6m6E568ZA",

    authDomain:
        "jogo-60a9e.firebaseapp.com",

    projectId:
        "jogo-60a9e",

    storageBucket:
        "jogo-60a9e.appspot.com",

    messagingSenderId:
        "352852303591",

    appId:
        "1:352852303591:web:8083c950047c9026bd8c42",

    databaseURL:
        "https://jogo-60a9e-default-rtdb.firebaseio.com/"

};


/* Inicializa Firebase principal */

let appPrincipal;

try{

    appPrincipal =
        firebase.initializeApp(
            firebaseConfigPrincipal,
            "principal"
        );

}catch(e){

    appPrincipal =
        firebase.app("principal");

}

const db =
    firebase.database(appPrincipal);


/* =========================================================
   ELEMENTOS
========================================================= */

const lista =
    document.getElementById("lista");

const totalReservasEl =
    document.getElementById("totalReservas");

const totalDiaEl =
    document.getElementById("totalDia");

const dataInput =
    document.getElementById("dataSelecionada");

const log =
    document.getElementById("log");

const historicoBox =
    document.getElementById("historicoBox");

const VALOR_FIXO = 1.00;


/* =========================================================
   DATA BR
========================================================= */

function hojeBR(){

    const d = new Date();

    const ano =
        d.getFullYear();

    const mes =
        String(d.getMonth()+1).padStart(2,'0');

    const dia =
        String(d.getDate()).padStart(2,'0');

    return `${ano}-${mes}-${dia}`;
}


const hoje = hojeBR();

dataInput.value = hoje;


/* =========================================================
   CARREGAR COMPRAS
========================================================= */

function carregar(data){

    db.ref("compras-dia/"+data).off();

    db.ref("compras-dia/"+data).on("value", snap=>{

        lista.innerHTML = "";

        let total = 0;
        let qtd = 0;

        const dados =
            snap.val() || {};


        Object.keys(dados).forEach(h=>{

            Object.keys(dados[h]).forEach(id=>{

                const d =
                    dados[h][id];

                const numeros =
                    Array.isArray(d.numeros)
                    ? d.numeros
                    : Object.values(
                        d.numeros || {}
                    );

                const extras =
                    Array.isArray(d.dezenasExtras)
                    ? d.dezenasExtras
                    : Object.values(
                        d.dezenasExtras || {}
                    );


                const valor =
                    numeros.length * VALOR_FIXO;

                total += valor;

                qtd++;


                lista.innerHTML += `

                <div class="item">

                    <strong>
                    ${d.nome || 'Sem nome'}
                    </strong>

                    <br>

                    Horário:
                    <b>${h}</b>

                    <br>

                    Números:
                    ${numeros.join('-')}

                    ${
                        extras.length
                        ?
                        '<br>🎁 Extra: '+extras.join('-')
                        :
                        ''
                    }

                    <br>

                    <span class="valor">
                    R$ ${valor.toFixed(2)}
                    </span>

                    <br>

                    <span class="data">
                    ${d.dataHora || ''}
                    </span>


                    <select
                    onchange="alterarStatus(
                    '${data}',
                    '${h}',
                    '${id}',
                    this.value
                    )">

                        <option
                        value="aguardando"
                        ${d.status==='aguardando'?'selected':''}>
                        Aguardando
                        </option>

                        <option
                        value="pagou"
                        ${d.status==='pagou'?'selected':''}>
                        Pagou
                        </option>

                        <option
                        value="cancelou"
                        ${d.status==='cancelou'?'selected':''}>
                        Cancelou
                        </option>

                    </select>


                    <select
                    onchange="alterarResultado(
                    '${data}',
                    '${h}',
                    '${id}',
                    this.value
                    )">

                        <option
                        value="aguardando"
                        ${d.resultado==='aguardando'?'selected':''}>
                        Resultado aguardando
                        </option>

                        <option
                        value="ganhou"
                        ${d.resultado==='ganhou'?'selected':''}>
                        Ganhou
                        </option>

                        <option
                        value="perdeu"
                        ${d.resultado==='perdeu'?'selected':''}>
                        Perdeu
                        </option>

                    </select>


                    <div class="botoes">

                        <button
                        class="limpar"
                        onclick="resetar(
                        '${data}',
                        '${h}',
                        '${id}'
                        )">
                        Limpar
                        </button>

                        <button
                        class="apagar"
                        onclick="excluir(
                        '${data}',
                        '${h}',
                        '${id}'
                        )">
                        Excluir
                        </button>

                    </div>

                </div>

                `;

            });

        });


        totalReservasEl.textContent =
            qtd;

        totalDiaEl.textContent =
            total
            .toFixed(2)
            .replace('.',',');

    });

}


/* =========================================================
   AÇÕES DAS COMPRAS
========================================================= */

function alterarStatus(d,h,id,v){

    db.ref(
        `compras-dia/${d}/${h}/${id}`
    ).update({
        status:v
    });

}


function alterarResultado(d,h,id,v){

    db.ref(
        `compras-dia/${d}/${h}/${id}`
    ).update({
        resultado:v
    });

}


function resetar(d,h,id){

    db.ref(
        `compras-dia/${d}/${h}/${id}`
    ).update({

        status:'aguardando',

        resultado:'aguardando'

    });

}


function excluir(data,horario,id){

    if(
        !confirm(
            'Excluir reserva e liberar números?'
        )
    ) return;


    db.ref(
        `compras-dia/${data}/${horario}/${id}`
    ).once('value',snap=>{

        const d =
            snap.val();

        if(!d) return;


        const todos = [

            ...(Array.isArray(d.numeros)
                ? d.numeros
                : Object.values(d.numeros || {})
            ),

            ...(Array.isArray(d.dezenasExtras)
                ? d.dezenasExtras
                : Object.values(d.dezenasExtras || {})
            )

        ];


        const updates = {};


        todos.forEach(n=>{

            updates[
                'numerosBloqueados/'+n
            ] = null;

        });


        updates[
            `compras-dia/${data}/${horario}/${id}`
        ] = null;


        db.ref()
        .update(updates);

    });

}


/* =========================================================
   LOG
========================================================= */

function escrever(msg){

    log.value +=
        '\n' + msg;

    log.scrollTop =
        log.scrollHeight;

}


/* =========================================================
   LIMPAR TEXTAREA INDEX
========================================================= */

function limparTextareaIndex(){

    db.ref(
        'controle/limparTextarea'
    )
    .set({

        limpar:true,

        em:Date.now()

    })
    .then(()=>{

        escrever(
            '✔ Textarea da index solicitado'
        );

    });

}


/* =========================================================
   LIBERAR NOVO JOGO
========================================================= */

function liberarNovoJogo(){

    Promise.all([

        db.ref(
            'numerosBloqueados'
        ).remove(),

        db.ref(
            'controle/limparTextarea'
        ).set({

            limpar:true,

            em:Date.now()

        })

    ])
    .then(()=>{

        escrever(
            '✔ Novo jogo liberado'
        );

    });

}


/* =========================================================
   APAGAR FIREBASE PRINCIPAL
========================================================= */

function limparTudoFirebase(){

    const senha =
        prompt(
            'Digite a senha ADMIN para apagar tudo'
        );


    if(senha !== '12345'){

        alert(
            'Senha incorreta'
        );

        return;

    }


    if(
        !confirm(
            'ATENÇÃO! Isso apagará TODOS os dados do Firebase principal. Continuar?'
        )
    ) return;


    db.ref()
    .remove()
    .then(()=>{

        escrever(
            '❌ Firebase principal apagado'
        );

    })
    .catch(err=>{

        escrever(
            '❌ Erro: ' + err.message
        );

    });

}


/* =========================================================
   MODOS
========================================================= */

function modoHistorico(){

    lista.style.display =
        'none';

    historicoBox.style.display =
        'block';

    carregarHistorico();

}


function modoCompras(){

    historicoBox.style.display =
        'none';

    lista.style.display =
        'block';

    carregar(
        dataInput.value
    );

}


/* =========================================================
   HISTÓRICO
========================================================= */

function carregarHistorico(){

    historicoBox.innerHTML =
        '🔄 Carregando histórico...';


    db.ref('historico')
    .orderByChild('timestamp')
    .once('value',snap=>{

        historicoBox.innerHTML = '';


        if(!snap.exists()){

            historicoBox.innerHTML =
                'Nenhum histórico encontrado.';

            return;

        }


        const dados =
            snap.val();

        const chaves =
            Object.keys(dados)
            .reverse();


        chaves.forEach(id=>{

            const h =
                dados[id];


            historicoBox.innerHTML += `

            <div class="historicoItem">

📅 ${h.data} (${h.dia})

⏰ ${h.hora}

----------------------------------

${h.conteudo}

            </div>

            `;

        });

    });

}


/* =========================================================
   DATA
========================================================= */

dataInput.addEventListener(
    'change',
    ()=>{
        carregar(
            dataInput.value
        );
    }
);


carregar(hoje);


/* =========================================================
   CONTROLE AUTOMÁTICO
========================================================= */

const CONTROLE_KEY =
    'controle/execucaoAuto';


function verificarHorarioAutomatico(){

    const agora =
        new Date();

    const diaSemana =
        agora.getDay();

    const hora =
        agora.getHours();

    const minuto =
        agora.getMinutes();


    if(
        !(
            (diaSemana === 3 ||
             diaSemana === 6)
            &&
            hora === 23
            &&
            minuto === 30
        )
    ){

        return;

    }


    const idExecucao =
        agora.toISOString()
        .slice(0,10)
        +
        '_23-30';


    db.ref(CONTROLE_KEY)
    .once('value',snap=>{

        if(
            snap.val() === idExecucao
        ){

            return;

        }


        executarLimpezaAutomatica(
            idExecucao
        );

    });

}


function executarLimpezaAutomatica(
    idExecucao
){

    db.ref('index/textarea')
    .once('value',snap=>{

        const conteudo =
            snap.val() || '';


        const agora =
            new Date();


        const dataBR =
            agora.toLocaleDateString(
                'pt-BR'
            );


        const diaBR =
            agora.toLocaleDateString(
                'pt-BR',
                {
                    weekday:'long'
                }
            );


        const horaBR =
            '23:30';


        db.ref(
            'historico/'+idExecucao
        )
        .set({

            data:dataBR,

            dia:diaBR,

            hora:horaBR,

            conteudo:conteudo,

            timestamp:Date.now()

        });


        Promise.all([

            db.ref(
                'index/textarea'
            ).set(''),

            db.ref(
                'numerosBloqueados'
            ).remove(),

            db.ref(
                'controle/limparTextarea'
            ).set({

                limpar:true,

                em:Date.now()

            }),

            db.ref(
                CONTROLE_KEY
            ).set(idExecucao)

        ])
        .then(()=>{

            escrever(
                '⏰ Limpeza automática executada ('+
                diaBR+
                ' 23:30)'
            );

        });

    });

}


/* =========================================================
   PIX GANHADOR
========================================================= */

/* =========================================================
   DEZENA PREMIADA
========================================================= */

const dezenaAtualEl =
    document.getElementById(
        'dezenaAtual'
    );

const modalDezenaAdmin =
    document.getElementById(
        'modalDezenaAdmin'
    );

const inputDezenaAdmin =
    document.getElementById(
        'inputDezenaAdmin'
    );

const btnDezenaAdmin =
    document.getElementById(
        'btnDezenaAdmin'
    );

const btnSalvarDezena =
    document.getElementById(
        'btnSalvarDezena'
    );

const btnFecharDezena =
    document.getElementById(
        'btnFecharDezena'
    );

const btnLimparDezena =
    document.getElementById(
        'btnLimparDezena'
    );


function podeDefinirDezena(){

    const agora =
        new Date();

    const diaSemana =
        agora.getDay();

    const minutosAtuais =
        agora.getHours()*60
        +
        agora.getMinutes();


    return (

        (
            diaSemana === 3 ||
            diaSemana === 6
        )

        &&

        minutosAtuais >= 1200

    );

}


function atualizarDezenaExibida(){

    db.ref(
        'admin/config/dezenaPremiada'
    )
    .once('value')
    .then(snap=>{

        const dezena =
            snap.val();


        if(
            dezena !== null &&
            dezena !== undefined &&
            dezena !== ''
        ){

            const numero =
                String(dezena)
                .padStart(2,'0');


            dezenaAtualEl.textContent =
                `🏆 Dezena premiada atual: ${numero}`;

        }else{

            dezenaAtualEl.textContent =
                '🏆 Dezena premiada atual: Nenhuma';

        }

    })
    .catch(err=>{

        console.error(err);

        dezenaAtualEl.textContent =
            '🏆 Erro ao carregar dezena';

    });

}


function abrirModalDezena(){

    if(
        !podeDefinirDezena()
    ){

        alert(
            '🔒 A dezena premiada só pode ser definida às 20:00 de quarta e sábado!'
        );

        return;

    }


    inputDezenaAdmin.value =
        '';

    modalDezenaAdmin.style.display =
        'flex';

}


function salvarDezenaPremiada(){

    const dezena =
        inputDezenaAdmin.value.trim();


    if(
        dezena === '' ||
        isNaN(dezena) ||
        Number(dezena) < 0 ||
        Number(dezena) > 99
    ){

        alert(
            '⚠ Digite uma dezena válida entre 0 e 99!'
        );

        return;

    }


    const valor =
        String(
            parseInt(dezena,10)
        )
        .padStart(2,'0');


    db.ref(
        'admin/config/dezenaPremiada'
    )
    .set(valor)
    .then(()=>{

        alert(
            '✅ Dezena premiada salva com sucesso!'
        );


        fecharModalDezena();

        atualizarDezenaExibida();


        log.value +=
            `\n✔ Dezena premiada salva: ${valor}`;

    })
    .catch(err=>{

        alert(
            '❌ Erro ao salvar dezena.'
        );

        console.error(err);

    });

}

        .then(()=>{

            atualizarDezenaExibida();

btnDezenaAdmin.addEventListener(

/* =========================================================
   FIREBASE EXTERNO
========================================================= */

let outroApp = null;

let outroDb = null;


/*
  Extrai o objeto firebaseConfig
  mesmo quando o usuário cola:

  const firebaseConfig = {...};

  ou somente:

  {...}
*/

function extrairFirebaseConfig(texto){

    texto =
        texto.trim();


    /*
      Remove const firebaseConfig =
    */

    texto =
        texto.replace(
            /^\s*(const|let|var)\s+firebaseConfig\s*=\s*/,
            ''
        );


    /*
      Remove ; do final
    */

    texto =
        texto.replace(
            /;\s*$/,
            ''
        );


    /*
      Tenta primeiro JSON
    */

    try{

        return JSON.parse(texto);

    }catch(e){}


    /*
      Converte objeto JS simples para JSON.
      Aceita propriedades com ou sem aspas.
    */

    let normalizado =
        texto;


    normalizado =
        normalizado.replace(
            /([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,
            '$1"$2":'
        );


    normalizado =
        normalizado.replace(
            /'/g,
            '"'
        );


    /*
      Remove vírgula antes de }
    */

    normalizado =
        normalizado.replace(
            /,\s*}/g,
            '}'
        );


    try{

        return JSON.parse(
            normalizado
        );

    }catch(e){

        throw new Error(
            'Não foi possível interpretar o firebaseConfig.'
        );

    }

}


/* =========================================================
   CONECTAR OUTRO FIREBASE
========================================================= */

function conectarOutroFirebase(){

    const campo =
        document.getElementById(
            'firebaseConfigInput'
        );

    const status =
        document.getElementById(
            'firebaseStatus'
        );

    const botao =
        document.getElementById(
            'btnApagarOutroFirebase'
        );


    const texto =
        campo.value.trim();


    if(!texto){

        status.className =
            'firebaseStatus erro';

        status.innerHTML =
            '❌ Cole primeiro o firebaseConfig.';

        botao.disabled =
            true;

        return;

    }


    try{

        const config =
            extrairFirebaseConfig(
                texto
            );


        /*
          Campos mínimos.
        */

        if(
            !config.apiKey ||
            !config.projectId ||
            !config.databaseURL
        ){

            throw new Error(
                'O config precisa conter apiKey, projectId e databaseURL.'
            );

        }


        /*
          Se já existir conexão anterior,
          ela será substituída.
        */

        if(outroApp){

            try{

                outroApp.delete();

            }catch(e){}

            outroApp =
                null;

            outroDb =
                null;

        }


        /*
          Nome exclusivo para não conflitar
          com o Firebase principal.
        */

        outroApp =
            firebase.initializeApp(
                config,
                'firebaseExterno_'+Date.now()
            );


        outroDb =
            firebase.database(
                outroApp
            );


        /*
          Testa se consegue acessar o banco.
        */

        outroDb.ref()
        .once('value')
        .then(snap=>{

            status.className =
                'firebaseStatus ok';

            status.innerHTML =

                '🟢 <b>Banco conectado!</b><br>' +

                'Projeto: ' +
                escapeHtml(
                    config.projectId
                ) +

                '<br>' +

                'Database: ' +
                escapeHtml(
                    config.databaseURL
                ) +

                '<br><br>' +

                'O botão de apagar está liberado.';

            botao.disabled =
                false;


            escrever(
                '✔ Banco externo conectado: '+
                config.projectId
            );

        })
        .catch(err=>{

            console.error(err);


            status.className =
                'firebaseStatus erro';

            status.innerHTML =
                '❌ Não foi possível acessar o banco.<br>' +
                escapeHtml(
                    err.message
                );

            botao.disabled =
                true;

        });


    }catch(err){

        console.error(err);


        status.className =
            'firebaseStatus erro';

        status.innerHTML =
            '❌ Configuração inválida.<br>' +
            escapeHtml(
                err.message
            );

        botao.disabled =
            true;

    }

}


/* =========================================================
   APAGAR OUTRO FIREBASE
========================================================= */

function apagarOutroFirebase(){

    if(!outroDb){

        alert(
            'Nenhum banco externo conectado.'
        );

        return;

    }


    /*
      Primeira confirmação
    */

    const confirmar =
        confirm(
            '⚠️ ATENÇÃO!\n\n' +
            'Isso apagará TODOS os dados da raiz do banco Firebase conectado.\n\n' +
            'Essa ação não pode ser desfeita.\n\n' +
            'Deseja continuar?'
        );


    if(!confirmar) return;


    /*
      Segunda confirmação por texto
    */

    const palavra =
        prompt(
            'Para confirmar, digite exatamente:\n\nAPAGAR'
        );


    if(
        palavra !== 'APAGAR'
    ){

        alert(
            '❌ Operação cancelada.'
        );

        return;

    }


    const botao =
        document.getElementById(
            'btnApagarOutroFirebase'
        );


    botao.disabled =
        true;

    botao.textContent =
        '⏳ APAGANDO...';


    outroDb.ref()
    .remove()
    .then(()=>{

        alert(
            '✅ Todos os dados do banco externo foram apagados.'
        );


        escrever(
            '❌ Banco Firebase externo apagado.'
        );


        botao.disabled =
            false;

        botao.textContent =
            '🗑️ APAGAR TODO O BANCO CONECTADO';


        document.getElementById(
            'firebaseStatus'
        ).innerHTML =
            '🟢 Banco conectado — todos os dados foram removidos.';

    })
    .catch(err=>{

        console.error(err);


        alert(
            '❌ Não foi possível apagar o banco.\n\n'+
            err.message
        );


        botao.disabled =
            false;

        botao.textContent =
            '🗑️ APAGAR TODO O BANCO CONECTADO';

    });

}


/* =========================================================
   PROTEÇÃO PARA TEXTO EXIBIDO
========================================================= */

function escapeHtml(valor){

    return String(valor)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================================================
   VERIFICA A CADA 30 SEGUNDOS
========================================================= */

setInterval(
    verificarHorarioAutomatico,
    30000
);

</script>
