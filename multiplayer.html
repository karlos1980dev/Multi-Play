/* =========================================================
   MOSTRAR DIA
========================================================= */

window.mostrarDia = function(dia) {

    document
        .querySelectorAll(".conteudo-dia")
        .forEach(el => {

            el.style.display =
                "none";

        });


    const container =
        document.getElementById(
            "conteudo-" + dia
        );


    if (!container) return;


    container.style.display =
        "block";


    document
        .querySelectorAll(".dias button")
        .forEach(btn => {

            btn.classList.remove(
                "ativo"
            );

        });


    const botao =
        document.querySelector(
            `.dias button[data-dia="${dia}"]`
        );


    if (botao) {

        botao.classList.add(
            "ativo"
        );

    }

};


/* =========================================================
   CARREGAR JOGOS
========================================================= */

async function carregarJogos(dia) {

    const container =
        document.getElementById(
            "conteudo-" + dia
        );


    if (!container) return;


    container.innerHTML =
        "<p>Carregando jogos...</p>";


    try {

        const snapshot =
            await get(
                ref(
                    db,
                    "jogos/" + dia
                )
            );


        if (!snapshot.exists()) {

            container.innerHTML =
                "<p>Nenhum jogo disponível.</p>";

            return;

        }


        let jogos =
            snapshot.val();


        if (!Array.isArray(jogos)) {

            jogos =
                Object.values(jogos);

        }


        container.innerHTML = "";


        const agora =
            new Date();


        let encontrou =
            false;


        jogos.forEach(
            (jogo, index) => {

                if (
                    !jogo ||
                    !jogo.data ||
                    !jogo.hora
                ) {

                    return;

                }


                const dataHora =
                    new Date(
                        `${jogo.data}T${jogo.hora}`
                    );


                /*
                 * NÃO MOSTRAR EXPIRADOS
                 */

                if (
                    dataHora <= agora
                ) {

                    return;

                }


                encontrou =
                    true;


                criarJogo(
                    container,
                    jogo,
                    index
                );

            }
        );


        if (!encontrou) {

            container.innerHTML =
                "<p>Não há jogos futuros para este dia.</p>";

        }

    } catch (erro) {

        console.error(
            erro
        );

        container.innerHTML =
            "<p>Erro ao carregar jogos.</p>";

    }

}

div.dataset.data = jogo.data || "";
div.dataset.hora = jogo.hora || "";

/* =========================================================
   NOME
========================================================= */

function extrairNome(url) {

    if (!url) return "Time";


    try {

        let nome =
            decodeURIComponent(
                url.split("/").pop()
            );


        nome =
            nome.replace(
                /\.(png|jpg|jpeg|webp|svg)$/i,
                ""
            );


        nome =
            nome.replace(
                /[_-]/g,
                " "
            );


        return nome
            .replace(
                /\s+/g,
                " "
            )
            .trim();

    } catch {

        return "Time";

    }

}


/* =========================================================
   DATA
========================================================= */

function formatarData(data) {

    if (!data) return "";

    const partes =
        data.split("-");


    if (partes.length !== 3)
        return data;


    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* =========================================================
   SELEÇÕES
========================================================= */

function atualizarSelecoes() {

    selects = [];

    document.querySelectorAll(".duelo").forEach(duelo => {

        const btn =
            duelo.querySelector(".btn.selecionado");

        if (!btn) return;

        const nomes =
            duelo.querySelectorAll(".nome-time");

        selects.push({

            timeA:
                nomes[0]?.textContent.trim() || "",

            timeB:
                nomes[1]?.textContent.trim() || "",

            valor:
                Number(btn.dataset.valor) || 0,

            escolha:
                btn.textContent
                    .trim()
                    .split("\n")[0]
                    .trim(),

            campeonato:
                duelo.dataset.campeonato ||
                "Campeonato",

            data:
                duelo.dataset.data || "",

            hora:
                duelo.dataset.hora || "",

            dataHora:
                `${duelo.dataset.data || ""} ${duelo.dataset.hora || ""}`,

            status:
                "aguardando"

        });

    });

    document.getElementById(
        "contadorMarcados"
    ).textContent =
        "Times " + selects.length;
}
/* =========================================================
   TOTAL
========================================================= */

function atualizarTotal() {

    const valor =
        Number(
            document.getElementById(
                "valorUnico"
            ).value
        ) || 0;


    let multiplicador =
        1;


    document
        .querySelectorAll(
            ".btn.selecionado"
        )
        .forEach(btn => {

            multiplicador *=
                Number(
                    btn.dataset.valor
                );

        });


    const total =
        valor *
        multiplicador;


    const totalFinal =
        document.getElementById(
            "totalFinal"
        );


    const apostar =
        document.getElementById(
            "apostarBtn"
        );


    if (
        valor <= 0 ||
        selects.length === 0
    ) {

        totalFinal.textContent =
            "Total: R$ 0,00";

        apostar.disabled =
            true;

        return;

    }


    if (total > LIMITE) {

        totalFinal.innerHTML =
            `<span style="color:red">
                R$ ${total.toFixed(2)}
            </span>`;

        apostar.disabled =
            true;

        return;

    }


    totalFinal.innerHTML =
        `<span style="color:green">
            R$ ${total.toFixed(2)}
        </span>`;


    apostar.disabled =
        false;

}


/* =========================================================
   ENVIO DA APOSTA
========================================================= */

document.getElementById("apostarBtn").onclick = async function () {

    const botao = this;

    try {

        const campoValor = document.getElementById("valorUnico");

        if (!campoValor) {
            alert("Erro: campo de valor não encontrado.");
            return;
        }

        const valor = Number(campoValor.value);

        if (!valor || valor <= 0) {
            alert("Digite um valor válido.");
            return;
        }

        if (!selects || selects.length === 0) {
            alert("Selecione pelo menos um jogo.");
            return;
        }

        /* ==========================================
           BLOQUEIA BOTÃO
        ========================================== */

        botao.disabled = true;

        botao.innerHTML = "Enviando...";

        /* ==========================================
           CÓDIGO
        ========================================== */

        const codigo = "MJ" + Date.now();

        /* ==========================================
           MONTA APOSTA
        ========================================== */

        const aposta = {

            codigo: codigo,

            valorUnico: valor,

            selecoes: selects.map(s => ({

                timeA: String(s.timeA || ""),

                timeB: String(s.timeB || ""),

                valor: Number(s.valor) || 0,

                escolha: String(s.escolha || ""),

                campeonato:
                    String(
                        s.campeonato ||
                        "Campeonato"
                    ),

                data:
                    String(
                        s.data || ""
                    ),

                hora:
                    String(
                        s.hora || ""
                    ),

                dataHora:
                    String(
                        s.dataHora || ""
                    ),

                status:
                    "aguardando"

            })),

            dataHora:
                new Date().toISOString()

        };


        console.log(
            "ENVIANDO APOSTA:",
            aposta
        );


        /* ==========================================
           SALVA NO FIREBASE
        ========================================== */

        await set(
            ref(
                db,
                "apostas/" + codigo
            ),
            aposta
        );


        console.log(
            "APOSTA SALVA:",
            codigo
        );


        /* ==========================================
           ABRE MODAL
           IMPORTANTE:
           O modal NÃO pode impedir o envio
        ========================================== */

        try {

            abrirModal(codigo);

        } catch (erroModal) {

            console.error(
                "ERRO AO ABRIR MODAL:",
                erroModal
            );

            /*
             * A aposta já foi salva.
             * Portanto não mostramos erro de conexão.
             */

            alert(
                "Aposta salva com sucesso!\n\n" +
                "Código: " + codigo
            );

        }


        /* ==========================================
           LIMPA SELEÇÕES
        ========================================== */

        document
            .querySelectorAll(
                ".btn.selecionado"
            )
            .forEach(btn => {

                btn.classList.remove(
                    "selecionado"
                );

            });


        selects = [];


        /* ==========================================
           LIMPA VALOR
        ========================================== */

        campoValor.value = "";


        /* ==========================================
           ATUALIZA CONTADOR
        ========================================== */

        const contador =
            document.getElementById(
                "contadorMarcados"
            );

        if (contador) {

            contador.textContent =
                "Times 0";

        }


        /* ==========================================
           ATUALIZA TOTAL
        ========================================== */

        atualizarTotal();


        /* ==========================================
           RESTAURA BOTÃO
        ========================================== */

        botao.disabled = true;

        botao.innerHTML = `
            Apostar
            <br>
            <span id="contadorMarcados">
                Times 0
            </span>
        `;


    } catch (erro) {

        console.error(
            "ERRO AO ENVIAR APOSTA:",
            erro
        );


        alert(
            "Não foi possível enviar a aposta.\n\n" +
            "Erro: " +
            (
                erro?.message ||
                String(erro)
            )
        );


        botao.disabled = false;

        botao.innerHTML = `
            Apostar
            <br>
            <span id="contadorMarcados">
                Times ${selects.length}
            </span>
        `;

    }

};
/* =========================================================
   MODAL
========================================================= */

function abrirModal(codigo) {

    const modal =
        document.getElementById(
            "codigoModal"
        );


    document.getElementById(
        "codigoAposta"
    ).textContent =
        codigo;


    /*
     * QR CODE
     */

    const pix =
        encodeURIComponent(
            chavePix
        );


    document.getElementById(
        "qrPix"
    ).innerHTML = `

        <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=170x170&data=${pix}"
            alt="QR Code PIX"
        >

        <p>
            PIX: <strong>${chavePix}</strong>
        </p>

    `;


    /*
     * MOSTRA MODAL
     */

    modal.style.display =
        "flex";


    /*
     * COPIAR
     */

    document.getElementById(
        "btnCopiar"
    ).onclick = async () => {

        try {

            await navigator.clipboard.writeText(
                codigo
            );

            alert(
                "Código copiado!"
            );

        } catch {

            alert(
                "Código: " + codigo
            );

        }

    };


    /*
     * WHATSAPP
     */

    document.getElementById(
        "btnWhatsapp"
    ).onclick = () => {

        const texto =
            `Minha aposta MULTI PLAY.BET%0A%0ACódigo: ${codigo}`;

        window.open(
            `https://wa.me/?text=${texto}`,
            "_blank"
        );

    };

}


/* =========================================================
   FECHAR MODAL
========================================================= */

document.getElementById(
    "btnFechar"
).onclick = () => {

    document.getElementById(
        "codigoModal"
    ).style.display =
        "none";

};


document.getElementById(
    "codigoModal"
).addEventListener(
    "click",
    event => {

        if (
            event.target.id ===
            "codigoModal"
        ) {

            event.target.style.display =
                "none";

        }

    }
);


/* =========================================================
   CARREGAR SOMENTE 3 DIAS
========================================================= */

async function inicializar() {

    const modal =
        document.getElementById(
            "modalCarregando"
        );


    modal.style.display =
        "flex";


    const hoje =
        new Date();


    const indiceHoje =
        hoje.getDay();


    /*
     * PRIMEIRO ESCONDE OS 7
     */

    document
        .querySelectorAll(
            "#diasContainer button"
        )
        .forEach(btn => {

            btn.style.display =
                "none";

            btn.classList.remove(
                "ativo"
            );

        });


    /*
     * ESCONDE CONTEÚDOS
     */

    document
        .querySelectorAll(
            ".conteudo-dia"
        )
        .forEach(el => {

            el.style.display =
                "none";

        });


    /*
     * MOSTRA APENAS:
     *
     * HOJE
     * AMANHÃ
     * DEPOIS DE AMANHÃ
     */

    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const indiceDia =
            (indiceHoje + i) % 7;


        const dia =
            dias[indiceDia];


        const botao =
            document.querySelector(
                `#diasContainer button[data-dia="${dia}"]`
            );


        if (botao) {

            botao.style.display =
                "inline-block";

        }


        await carregarJogos(
            dia
        );

    }


    /*
     * ABRE HOJE
     */

    const diaHoje =
        dias[indiceHoje];


    mostrarDia(
        diaHoje
    );


    modal.style.display =
        "none";

}


/* =========================================================
   CLIQUE NOS 3 DIAS
========================================================= */

document
    .querySelectorAll(
        "#diasContainer button"
    )
    .forEach(btn => {

        btn.addEventListener(
            "click",
            async () => {

                const dia =
                    btn.dataset.dia;


                await carregarJogos(
                    dia
                );


                mostrarDia(
                    dia
                );

            }
        );

    });


/* =========================================================
   VALOR
========================================================= */

document.getElementById(
    "valorUnico"
).addEventListener(
    "input",
    atualizarTotal
);


/* =========================================================
   CARROSSEL
========================================================= */

const carrossel =
    document.getElementById(
        "carrossel"
    );


let slide = 0;


setInterval(() => {

    if (!carrossel) return;


    const total =
        carrossel.children.length;


    slide =
        (slide + 1) %
        total;


    carrossel.style.transform =
        `translateX(-${slide * 100}%)`;

}, 3000);


/* =========================================================
   INICIAR
========================================================= */

inicializar();

</script>
