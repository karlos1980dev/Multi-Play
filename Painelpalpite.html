<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Admin - Palpites</title>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#020617;
  color:white;
  padding:12px;
}

.container{
  max-width:650px;
  margin:auto;
}

/* =========================
   TÍTULO
========================= */

h1{
  text-align:center;
  color:#22c55e;
  font-size:22px;
  margin-bottom:8px;
}

/* =========================
   STATUS
========================= */

.status{
  text-align:center;
  color:#94a3b8;
  font-size:13px;
  margin-bottom:12px;
}

/* =========================
   CONTADOR
========================= */

.contador{
  background:#16a34a;
  padding:13px;
  border-radius:12px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin-bottom:15px;
}

/* =========================
   CARD
========================= */

.card{
  background:#1e293b;
  padding:14px;
  border-radius:15px;
  margin-bottom:14px;
  box-shadow:0 5px 15px rgba(0,0,0,.25);
}

/* =========================
   NOME
========================= */

.nome{
  color:#22c55e;
  font-size:20px;
  font-weight:bold;
  margin-bottom:10px;
}

/* =========================
   VALOR
========================= */

.valor{
  color:#facc15;
  font-weight:bold;
  margin-bottom:7px;
}

/* =========================
   PRÊMIO
========================= */

.premio{
  color:#38bdf8;
  font-weight:bold;
  margin-bottom:12px;
}

/* =========================
   JOGO
========================= */

.jogo{
  background:#334155;
  border-radius:10px;
  padding:12px;
  margin-top:8px;
}

.confronto{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.times{
  font-size:14px;
  font-weight:bold;
  color:#e2e8f0;
}

.palpite{
  font-size:22px;
  font-weight:bold;
  color:#22c55e;
  white-space:nowrap;
}

/* =========================
   DATA
========================= */

.data{
  color:#94a3b8;
  font-size:11px;
  margin-top:12px;
  line-height:1.5;
  border-top:1px solid #475569;
  padding-top:9px;
}

/* =========================
   VAZIO
========================= */

.vazio{
  text-align:center;
  color:#94a3b8;
  padding:30px 10px;
  background:#1e293b;
  border-radius:12px;
}

/* =========================
   BOTÃO
========================= */

button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:10px;
  background:#dc2626;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}

button:active{
  transform:scale(.98);
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:380px){

  .times{
    font-size:13px;
  }

  .palpite{
    font-size:20px;
  }

}

</style>

</head>

<body>

<div class="container">

<h1>
  📋 PAINEL DE PALPITES
</h1>

<div id="status" class="status">
  🔄 Conectando...
</div>

<div id="contador" class="contador">
  PALPITES: 0
</div>

<div id="lista">

  <div class="vazio">
    Nenhum palpite recebido.
  </div>

</div>

<button onclick="limparTodos()">
  🗑️ LIMPAR TODOS
</button>

</div>


<script>

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyAGOy5lPtqjSTtZpyFX7xtGGy3P2nYA77U",

  authDomain:
    "placarexato-97966.firebaseapp.com",

  databaseURL:
    "https://placarexato-97966-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "placarexato-97966",

  storageBucket:
    "placarexato-97966.firebasestorage.app",

  messagingSenderId:
    "942191850183",

  appId:
    "1:942191850183:web:9870fab0d09044b11004e2"

};

firebase.initializeApp(firebaseConfig);

const db =
  firebase.database();

const palpitesRef =
  db.ref("palpites");


/* =========================
   CRIAR JOGO
========================= */

function criarJogo(numero,item){

  const objeto =
    item["jogo" + numero];

  if(!objeto){
    return "";
  }

  let confronto = "";
  let palpite = "-";


  /* NOVO FORMATO */

  if(typeof objeto === "object"){

    confronto =
      objeto.confronto || "";

    palpite =
      objeto.palpite || "-";

  }

  /* FORMATO ANTIGO */

  else{

    palpite =
      objeto || "-";

  }


  return `

    <div class="jogo">

      <div class="confronto">

        <div class="times">

          ⚽ ${escapeHTML(confronto)}

        </div>

        <div class="palpite">

          ${escapeHTML(palpite)}

        </div>

      </div>

    </div>

  `;

}


/* =========================
   RECEBER EM TEMPO REAL
========================= */

palpitesRef.on("value", snapshot => {

  const lista =
    document.getElementById("lista");

  const contador =
    document.getElementById("contador");


  let dados = [];


  snapshot.forEach(child => {

    dados.push({

      id:child.key,

      ...child.val()

    });

  });


  /* MAIS NOVOS PRIMEIRO */

  dados.reverse();


  contador.textContent =
    "PALPITES: " + dados.length;


  if(dados.length === 0){

    lista.innerHTML = `

      <div class="vazio">

        Nenhum palpite recebido.

      </div>

    `;

    return;

  }


  lista.innerHTML = "";


  dados.forEach(item => {

    /* VALOR */

    const valor =
      Number(item.valor || 2)
      .toFixed(2)
      .replace(".",",");


    /* PRÊMIO */

    const premio =
      Number(item.premio || 100)
      .toFixed(2)
      .replace(".",",");


    lista.innerHTML += `

      <div class="card">

        <div class="nome">

          👤 ${escapeHTML(
            item.nome || "Sem nome"
          )}

        </div>


        <div class="valor">

          💰 Valor:
          R$ ${valor}

        </div>


        <div class="premio">

          🏆 Prêmio:
          R$ ${premio}

        </div>


        ${criarJogo(1,item)}

        ${criarJogo(2,item)}

        ${criarJogo(3,item)}
        
        ${criarJogo(4,item)}
        
        ${criarJogo(5,item)}
        
        ${criarJogo(6,item)}
        
        ${criarJogo(7,item)}


        <div class="data">

          📅 ${escapeHTML(
            item.data || ""
          )}

        </div>

      </div>

    `;

  });

});


/* =========================
   CONEXÃO
========================= */

db.ref(".info/connected")
.on("value",snap => {

  const status =
    document.getElementById("status");


  if(snap.val() === true){

    status.textContent =
      "🟢 ONLINE — Recebendo em tempo real";

    status.style.color =
      "#22c55e";

  }else{

    status.textContent =
      "🔴 OFFLINE";

    status.style.color =
      "#ef4444";

  }

});


/* =========================
   LIMPAR TODOS
========================= */

function limparTodos(){

  if(!confirm(
    "⚠️ Deseja apagar TODOS os palpites?"
  )){

    return;

  }


  palpitesRef
    .remove()

    .then(() => {

      alert(
        "✅ Todos os palpites foram apagados."
      );

    })

    .catch(erro => {

      console.error(erro);

      alert(
        "❌ Erro ao apagar os palpites."
      );

    });

}


/* =========================
   SEGURANÇA
========================= */

function escapeHTML(text){

  return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
