<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Painel Administrativo - Placar</title>

<style> * { box-sizing: border-box; } html, body { margin: 0; padding: 0; } body { font-family: Arial, sans-serif; background: #f1f1f1; color: #111; padding: 15px; } .container { width: 100%; max-width: 700px; margin: auto; } .topo { background: #000; color: #fff; padding: 18px; border-radius: 12px; text-align: center; margin-bottom: 15px; } .topo h1 { margin: 0; font-size: 22px; } .topo p { margin: 7px 0 0; font-size: 13px; color: #ccc; } /* BUSCA */ .busca { background: #fff; padding: 15px; border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.15); margin-bottom: 15px; } .busca label { display: block; font-weight: bold; margin-bottom: 7px; } .busca-linha { display: flex; gap: 8px; } #codigoBusca { flex: 1; min-width: 0; height: 45px; border: 1px solid #bbb; border-radius: 7px; padding: 10px; font-size: 15px; text-transform: uppercase; } #btnBuscar { width: 110px; height: 45px; border: none; border-radius: 7px; background: #0072d3; color: #fff; font-weight: bold; cursor: pointer; } #btnBuscar:hover { background: #005ca8; } /* APOSTA */ .aposta { display: none; } .aposta-cabecalho { background: #008000; color: #fff; padding: 15px; border-radius: 10px; margin-bottom: 10px; } .aposta-cabecalho h2 { margin: 0 0 8px; font-size: 19px; } .aposta-info { font-size: 13px; line-height: 1.7; } /* JOGO */ .jogo-card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.15); } .jogo-numero { font-size: 12px; color: #777; font-weight: bold; margin-bottom: 7px; } .times { background: #008000; color: #fff; padding: 10px; border-radius: 7px; text-align: center; font-size: 18px; font-weight: bold; } .info-jogo { margin-top: 9px; background: #f1f1f1; padding: 9px; border-radius: 7px; font-size: 12px; line-height: 1.7; } /* PALPITE */ .palpite { margin-top: 10px; padding: 10px; background: #eee; border-radius: 7px; font-weight: bold; text-align: center; } /* PLACAR */ .titulo-placar { margin-top: 15px; font-weight: bold; text-align: center; } .placar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 8px; } .placar input { width: 90px; height: 48px; border: 2px solid #aaa; border-radius: 8px; text-align: center; font-size: 22px; font-weight: bold; } .placar span { font-size: 22px; font-weight: bold; } /* STATUS */ .status-titulo { margin-top: 15px; font-weight: bold; } .status-botoes { display: flex; gap: 7px; margin-top: 8px; } .status-botoes button { flex: 1; min-height: 43px; border: none; border-radius: 7px; color: #fff; font-weight: bold; cursor: pointer; } .btn-aguardando { background: #ff9800; } .btn-ganhou { background: #00a000; } .btn-perdeu { background: #d00000; } .btn-selecionado { box-shadow: 0 0 0 3px #000; } /* SALVAR */ .btnSalvar { width: 100%; height: 48px; margin-top: 15px; border: none; border-radius: 8px; background: #0072d3; color: #fff; font-size: 15px; font-weight: bold; cursor: pointer; } .btnSalvar:hover { background: #005ca8; } /* MENSAGEM */ .mensagem { display: none; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; text-align: center; } .mensagem.sucesso { display: block; background: #d1fae5; color: #065f46; } .mensagem.erro { display: block; background: #fee2e2; color: #991b1b; } /* LOADING */ .carregando { display: none; background: #fff; padding: 20px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 15px; } /* RESPONSIVO */ @media(max-width:500px) { body { padding: 8px; } .busca-linha { flex-direction: column; } #btnBuscar { width: 100%; } .status-botoes { flex-wrap: wrap; } .status-botoes button { min-width: 30%; } .placar input { width: 80px; } } </style>

</head>

<body>

<div class="container">

<div class="topo"> <h1> ⚽ Painel Administrativo </h1> <p> Editar placar e resultado das apostas </p> </div> <div id="mensagem" class="mensagem"> </div> <div id="carregando" class="carregando"> Carregando aposta... </div> <!-- BUSCA --> <div class="busca"> <label> 🎟️ Código da aposta </label> <div class="busca-linha"> <input type="text" id="codigoBusca" placeholder="Ex: MJ1787959210532" > <button id="btnBuscar"> Buscar </button> </div> </div> <!-- APOSTA --> <div id="aposta" class="aposta"> <div class="aposta-cabecalho"> <h2> 🎟️ <span id="codigoAposta"></span> </h2> <div class="aposta-info"> 👤 Jogador: <strong id="nomeJogador"> - </strong> <br> 💰 Aposta: <strong id="valorAposta"> R$ 0,00 </strong> <br> 🎯 Jogos: <strong id="quantidadeJogos"> 0 </strong> <br> 💵 Retorno: <strong id="retornoAposta"> R$ 0,00 </strong> </div> </div> <div id="listaJogos"></div> </div>

</div>

<script type="module"> /* ========================================================= FIREBASE ========================================================= */ import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js"; import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-database.js"; const firebaseConfig = { apiKey: "AIzaSyA5a-2HzvcljnAfXE7P3ThDnq6m6E568ZA", authDomain: "jogo-60a9e.firebaseapp.com", projectId: "jogo-60a9e", storageBucket: "jogo-60a9e.appspot.com", messagingSenderId: "352852303591", appId: "1:352852303591:web:8083c950047c9026bd8c42", databaseURL: "https://jogo-60a9e-default-rtdb.firebaseio.com/" }; const app = initializeApp(firebaseConfig); const db = getDatabase(app); /* ========================================================= ELEMENTOS ========================================================= */ const codigoBusca = document.getElementById( "codigoBusca" ); const btnBuscar = document.getElementById( "btnBuscar" ); const apostaDiv = document.getElementById( "aposta" ); const listaJogos = document.getElementById( "listaJogos" ); const carregando = document.getElementById( "carregando" ); const mensagem = document.getElementById( "mensagem" ); /* ========================================================= APOSTA ATUAL ========================================================= */ let apostaAtual = null; let codigoAtual = ""; /* ========================================================= DINHEIRO ========================================================= */ function dinheiro(valor) { return Number(valor || 0) .toLocaleString( "pt-BR", { style: "currency", currency: "BRL" } ); } /* ========================================================= ESCAPE ========================================================= */ function escapeHTML(texto) { return String(texto || "") .replace(/&/g, "&amp;") .replace(/</g, "&lt;") .replace(/>/g, "&gt;") .replace(/"/g, "&quot;") .replace(/'/g, "&#039;"); } /* ========================================================= DATA ========================================================= */ function formatarData(data) { if (!data) { return ""; } const partes = String(data).split("-"); if (partes.length !== 3) { return data; } return `${partes[2]}/${partes[1]}/${partes[0]}`; } /* ========================================================= MENSAGEM ========================================================= */ function mostrarMensagem( texto, tipo ) { mensagem.textContent = texto; mensagem.className = "mensagem " + tipo; setTimeout( () => { mensagem.className = "mensagem"; }, 4000 ); } /* ========================================================= BUSCAR APOSTA ========================================================= */ async function buscarAposta() { let codigo = codigoBusca.value .trim() .toUpperCase(); if (!codigo) { mostrarMensagem( "Digite o código da aposta.", "erro" ); return; } carregando.style.display = "block"; apostaDiv.style.display = "none"; try { const apostaRef = ref( db, "apostas/" + codigo ); const snapshot = await get( apostaRef ); if (!snapshot.exists()) { mostrarMensagem( "Aposta não encontrada.", "erro" ); carregando.style.display = "none"; return; } apostaAtual = snapshot.val(); codigoAtual = codigo; mostrarAposta(); } catch (erro) { console.error( erro ); mostrarMensagem( "Erro ao buscar aposta: " + (erro.message || erro), "erro" ); } finally { carregando.style.display = "none"; } } /* ========================================================= MOSTRAR APOSTA ========================================================= */ function mostrarAposta() { document.getElementById( "codigoAposta" ).textContent = apostaAtual.codigo || codigoAtual; document.getElementById( "nomeJogador" ).textContent = apostaAtual.nome || "-"; document.getElementById( "valorAposta" ).textContent = dinheiro( apostaAtual.valorUnico ); const selecoes = Array.isArray( apostaAtual.selecoes ) ? apostaAtual.selecoes : Object.values( apostaAtual.selecoes || {} ); document.getElementById( "quantidadeJogos" ).textContent = apostaAtual.quantidadeJogos || selecoes.length; document.getElementById( "retornoAposta" ).textContent = dinheiro( apostaAtual.possivelRetorno ); listaJogos.innerHTML = ""; if (!selecoes.length) { listaJogos.innerHTML = "<p>Nenhum jogo encontrado nesta aposta.</p>"; apostaDiv.style.display = "block"; return; } selecoes.forEach( (jogo, index) => { criarCardJogo( jogo, index ); } ); apostaDiv.style.display = "block"; } /* ========================================================= CRIAR CARD DO JOGO ========================================================= */ function criarCardJogo( jogo, index ) { const card = document.createElement( "div" ); card.className = "jogo-card"; const placarA = jogo.placarA !== undefined && jogo.placarA !== null ? jogo.placarA : ""; const placarB = jogo.placarB !== undefined && jogo.placarB !== null ? jogo.placarB : ""; const resultado = String( jogo.resultado || "aguardando" ).toLowerCase(); let statusAguardando = ""; let statusGanhou = ""; let statusPerdeu = ""; if ( resultado === "aguardando" ) { statusAguardando = "btn-selecionado"; } else if ( resultado === "ganhou" ) { statusGanhou = "btn-selecionado"; } else if ( resultado === "perdeu" ) { statusPerdeu = "btn-selecionado"; } card.innerHTML = ` <div class="jogo-numero"> JOGO ${index + 1} </div> <div class="times"> ${escapeHTML( jogo.timeA || "Time A" )} × ${escapeHTML( jogo.timeB || "Time B" )} </div> <div class="info-jogo"> 🏆 <strong> ${escapeHTML( jogo.campeonato || "Campeonato" )} </strong> <br> 📅 ${formatarData( jogo.data || "" )} &nbsp; ⏰ ${escapeHTML( jogo.hora || "" )} </div> <div class="palpite"> 🎯 Palpite: <strong> ${escapeHTML( jogo.escolha || "-" )} </strong> &nbsp; Cotação: <strong> ${Number( jogo.valor || 0 ).toFixed(2)} </strong> </div> <div class="titulo-placar"> ⚽ PLACAR FINAL </div> <div class="placar"> <input type="number" min="0" max="99" step="1" class="placarA" value="${escapeHTML( placarA )}" placeholder="Casa" > <span> × </span> <input type="number" min="0" max="99" step="1" class="placarB" value="${escapeHTML( placarB )}" placeholder="Fora" > </div> <div class="status-titulo"> 🏆 RESULTADO </div> <div class="status-botoes"> <button type="button" class="btn-aguardando ${statusAguardando}" data-status="aguardando" > Aguardando </button> <button type="button" class="btn-ganhou ${statusGanhou}" data-status="ganhou" > Ganhou </button> <button type="button" class="btn-perdeu ${statusPerdeu}" data-status="perdeu" > Perdeu </button> </div> <button type="button" class="btnSalvar" > 💾 Salvar resultado </button> `; listaJogos.appendChild( card ); /* ===================================================== STATUS ===================================================== */ let statusSelecionado = resultado; card.querySelectorAll( ".status-botoes button" ).forEach( botao => { botao.onclick = () => { statusSelecionado = botao.dataset.status; card.querySelectorAll( ".status-botoes button" ).forEach( outro => { outro.classList.remove( "btn-selecionado" ); } ); botao.classList.add( "btn-selecionado" ); }; } ); /* ===================================================== SALVAR ===================================================== */ card.querySelector( ".btnSalvar" ).onclick = async () => { await salvarResultado( index, card, statusSelecionado ); }; } /* ========================================================= SALVAR RESULTADO ========================================================= */ async function salvarResultado( index, card, resultado ) { const inputA = card.querySelector( ".placarA" ); const inputB = card.querySelector( ".placarB" ); let placarA = inputA.value.trim(); let placarB = inputB.value.trim(); if ( placarA === "" || placarB === "" ) { mostrarMensagem( "Informe os dois placares.", "erro" ); return; } placarA = Number(placarA); placarB = Number(placarB); if ( !Number.isInteger(placarA) || !Number.isInteger(placarB) || placarA < 0 || placarB < 0 ) { mostrarMensagem( "O placar deve conter números inteiros maiores ou iguais a zero.", "erro" ); return; } const botao = card.querySelector( ".btnSalvar" ); botao.disabled = true; botao.textContent = "Salvando..."; try { const caminho = `apostas/${codigoAtual}/selecoes/${index}`; await update( ref( db, caminho ), { placarA: placarA, placarB: placarB, resultado: resultado, status: resultado } ); /* ================================================ ATUALIZA OBJETO LOCAL ================================================ */ if ( Array.isArray( apostaAtual.selecoes ) ) { apostaAtual.selecoes[index] .placarA = placarA; apostaAtual.selecoes[index] .placarB = placarB; apostaAtual.selecoes[index] .resultado = resultado; apostaAtual.selecoes[index] .status = resultado; } mostrarMensagem( `Jogo ${index + 1} atualizado: ${placarA} × ${placarB} — ${textoResultado(resultado)}.`, "sucesso" ); } catch (erro) { console.error( "Erro ao salvar:", erro ); mostrarMensagem( "Erro ao salvar resultado: " + (erro.message || erro), "erro" ); } finally { botao.disabled = false; botao.textContent = "💾 Salvar resultado"; } } /* ========================================================= TEXTO DO RESULTADO ========================================================= */ function textoResultado( resultado ) { if ( resultado === "ganhou" ) { return "Ganhou"; } if ( resultado === "perdeu" ) { return "Perdeu"; } return "Aguardando"; } /* ========================================================= BOTÃO BUSCAR ========================================================= */ btnBuscar.onclick = buscarAposta; /* ========================================================= ENTER NO INPUT ========================================================= */ codigoBusca.addEventListener( "keydown", event => { if ( event.key === "Enter" ) { buscarAposta(); } } ); </script>

</body>

</html>
